<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITAP Adventure</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; }
  body { background:#0d1410; color:#e8efe6; font-family: Georgia, serif; overflow:hidden; height:100vh; height:100dvh; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:12px; bottom:10px; font-size:13px; background:rgba(0,0,0,.5); padding:6px 10px; border-radius:6px; }
  #lookBtn { position:fixed; right:12px; top:12px; font-family:inherit; font-size:13px; color:#e8efe6; background:rgba(0,0,0,.6); border:1px solid #5b4324; border-radius:6px; padding:6px 10px; cursor:pointer; }
  #creator { position:fixed; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none; z-index:5; }
  #creator[hidden] { display:none; }
  .crBox { pointer-events:auto; background:rgba(30,24,16,.95); border:2px solid #f0c35a; border-radius:10px; padding:12px 14px; width:290px; max-width:92vw; position:relative; }
  .crBox:after { content:''; position:absolute; left:50%; bottom:-12px; transform:translateX(-50%); border:10px solid transparent; border-top:12px solid #f0c35a; border-bottom:0; }
  .crBox h2 { margin:0 0 8px; font-size:15px; color:#f0c35a; text-transform:uppercase; letter-spacing:1px; text-align:center; }
  .crRow { display:flex; align-items:center; justify-content:space-between; margin:4px 0; font-size:14px; }
  .crRow span { min-width:160px; text-align:center; }
  .crRow button, #crStart { font-family:inherit; background:#1d150b; color:#e8efe6; border:1px solid #5b4324; border-radius:5px; padding:3px 11px; cursor:pointer; }
  #crStart { margin-top:10px; font-size:15px; padding:7px 18px; color:#f0c35a; width:100%; }
  #tabbar { position:fixed; right:12px; top:52px; display:flex; flex-direction:column; gap:6px; z-index:8; }
  .tabIcon { width:36px; height:36px; background:rgba(20,16,10,.85); border:2px solid #5b4324; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .tabIcon.on { border-color:#f0c35a; }
  .tabIcon svg { width:22px; height:22px; shape-rendering:crispEdges; }
  #statsPanel { position:fixed; right:58px; top:52px; width:240px; background:rgba(20,16,10,.94); border:2px solid #5b4324; border-radius:6px; z-index:8; font:13px Georgia,serif; color:#e8efe6; }
  #statsPanel[hidden] { display:none; }
  .subTabs { display:flex; border-bottom:1px solid #5b4324; }
  .subTabs button { flex:1; background:#2a1f10; color:#e8efe6; border:0; padding:7px 0; font:inherit; cursor:pointer; }
  .subTabs button.on { background:#3a2a16; color:#f0c35a; }
  .statsBody { padding:8px 10px; }
  .statsBody h4 { margin:6px 0 4px; color:#f0c35a; font-size:14px; }
  .skillGrid { display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; }
  .skillGrid span b { color:#f0c35a; font-weight:normal; }
  .statRow { display:flex; justify-content:space-between; margin:2px 0; }
  .statRow b { color:#f0c35a; font-weight:normal; }
  #bagPanel { position:fixed; right:58px; top:52px; width:240px; background:rgba(20,16,10,.94); border:2px solid #5b4324; border-radius:6px; z-index:8; font:13px Georgia,serif; color:#e8efe6; }
  #bagPanel[hidden] { display:none; }
  .bagHead { padding:7px 10px; border-bottom:1px solid #5b4324; color:#f0c35a; font-size:14px; }
  .bagGrid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:8px 10px; }
  .slot { aspect-ratio:1; background:#1d160c; border:1px solid #5b4324; border-radius:4px; display:flex; align-items:center; justify-content:center; position:relative; }
  .slot.full { background:#3a2a16; }
  .slot .swatch { width:14px; height:14px; border-radius:3px; }
  .slot .qty { position:absolute; right:3px; bottom:0; font-size:10px; color:#f0c35a; }
  .bagFoot { padding:0 10px 8px; font-size:12px; color:#c9b27a; }
  #gearPanel { position:fixed; right:58px; top:52px; width:240px; background:rgba(20,16,10,.94); border:2px solid #5b4324; border-radius:6px; z-index:8; font:13px Georgia,serif; color:#e8efe6; }
  #gearPanel[hidden] { display:none; }
  .gearList { padding:6px 10px 8px; }
  .gearRow { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #3a2a16; }
  .gearRow b { color:#f0c35a; font-weight:normal; }
  #setPanel { position:fixed; right:58px; top:52px; width:240px; border:2px solid #5b4324; border-radius:6px; z-index:8; font:13px Georgia,serif; color:#e8efe6; }
  #setPanel[hidden] { display:none; }
  .setRow { display:flex; align-items:center; gap:8px; padding:8px 10px; }
  .setRow label { width:52px; }
  .setRow input[type=range] { flex:1; accent-color:#f0c35a; }
  .muteBtn { width:30px; height:30px; flex:none; padding:0; background:#1d150b; border:1px solid #5b4324; border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .muteBtn svg { width:18px; height:18px; }
  .muteBtn.muted { border-color:#d64b3c; }
  #online[hidden] { display: none !important; }
  .chatBub { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; z-index: 6; max-width: 240px; padding: 5px 9px; margin-top: -9px; background: rgba(12, 10, 8, .9); border: 1px solid #5b4324; border-radius: 8px; color: #ffe14d; font: 14px Georgia, serif; line-height: 1.3; text-align: center; word-wrap: break-word; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .chatBub:after { content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); border: 6px solid transparent; border-top: 7px solid #5b4324; border-bottom: 0; }
  .chatBub:before { content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-top: 6px solid rgba(12, 10, 8, .9); border-bottom: 0; z-index: 1; }
  #dlgChoice[hidden], #shopPanel[hidden] { display: none !important; }
  /* polish: warm parchment-and-gold panels, soft shadows, a vignette */
  body:after { content:''; position:fixed; inset:0; pointer-events:none; z-index:4; background:radial-gradient(ellipse at center, transparent 55%, rgba(10,8,4,.38) 100%); }
  #statsPanel, #bagPanel, #gearPanel, #setPanel, #shopPanel, #smithPanel, #dialog { background:linear-gradient(180deg, rgba(48,36,20,.96), rgba(22,16,9,.96)) !important; border-color:#a07a3c !important; box-shadow:0 8px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,150,.15); backdrop-filter:blur(4px); }
  .tabIcon, #logoutBtn, #lookBtn { background:linear-gradient(180deg, rgba(58,42,22,.92), rgba(26,18,10,.92)) !important; border-color:#a07a3c !important; box-shadow:0 3px 10px rgba(0,0,0,.45); transition:transform .12s, border-color .12s; }
  .tabIcon:hover, #logoutBtn:hover, #lookBtn:hover { transform:translateY(-1px); border-color:#f0c35a !important; }
  #hint, #toast, #chatLog { backdrop-filter:blur(3px); box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .bagHead, #dlgName, .crBox h2 { letter-spacing:.5px; text-shadow:0 1px 0 #000; }
</style>
</head>
<body>
<div id="tip" style="position:fixed;display:none;pointer-events:none;background:rgba(0,0,0,.78);color:#fff;font:14px Georgia,serif;padding:3px 7px;border-radius:4px;z-index:7;white-space:nowrap"></div>

  <div class="setRow"><button class="muteBtn" id="muteSfx" title="Mute sounds"></button><label for="volSfx">Sounds</label><input type="range" id="volSfx" min="0" max="100"></div>

  <div style="text-align:right;margin-top:8px"><button id="dlgNext" style="font:inherit;background:#1d150b;color:#e8efe6;border:1px solid #5b4324;border-radius:5px;padding:3px 12px;cursor:pointer">Continue</button></div>
  <div id="dlgChoice" hidden style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button id="dlgYes" style="font:inherit;background:#1d150b;color:#f0c35a;border:1px solid #5b4324;border-radius:5px;padding:4px 14px;cursor:pointer">Yes</button><button id="dlgNo" style="font:inherit;background:#1d150b;color:#e8efe6;border:1px solid #5b4324;border-radius:5px;padding:4px 14px;cursor:pointer">No</button></div>
</div>

</div>

  <div style="background:rgba(30,24,16,.97);border:2px solid #f0c35a;border-radius:10px;padding:18px 20px;width:min(320px,88vw);text-align:center;color:#e8efe6;font:15px Georgia,serif;">
    <div style="color:#f0c35a;font-size:18px;margin-bottom:8px">ITAP Adventure</div>
    <div id="onlineStatus" style="min-height:20px;font-size:13px;color:#c9b27a;margin-bottom:10px">Connecting...</div>

      <input id="nameInput" maxlength="12" placeholder="Your name" style="width:100%;box-sizing:border-box;padding:7px;font:15px Georgia,serif;background:#1d150b;color:#e8efe6;border:1px solid #5b4324;border-radius:6px;">

    <button id="retryBtn" hidden style="margin-top:6px;font:14px Georgia,serif;padding:6px 14px;background:#1d150b;color:#e8efe6;border:1px solid #5b4324;border-radius:6px;cursor:pointer">Try again</button>
  </div>

<button id="logoutBtn" style="position:fixed;left:12px;top:12px;z-index:8;font:13px Georgia,serif;color:#e8efe6;background:rgba(0,0,0,.6);border:1px solid #5b4324;border-radius:6px;padding:6px 10px;cursor:pointer">Log out</button>

<div id="creator" hidden>
  <div class="crBox">
    <h2>Create your adventurer</h2>
    <div id="crRows"></div>
    <button id="crStart">Start playing</button>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",

</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ----- the look options -----
const LOOK = [
  {key: 'gender', label: 'Build', values: [{id: 'male', label: 'Male'}, {id: 'female', label: 'Female'}]},
  {key: 'hair', label: 'Hair', values: [{id: 'short', label: 'Short'}, {id: 'long', label: 'Long'}, {id: 'topknot', label: 'Top knot'}]},
  {key: 'hairCol', label: 'Hair colour', values: [{id: 0x4a2a14, label: 'Brown'}, {id: 0x1a1a1a, label: 'Black'}, {id: 0xe0c070, label: 'Blonde'}, {id: 0xa03a1e, label: 'Red'}, {id: 0x9a9aa0, label: 'Grey'}]},
  {key: 'skin', label: 'Skin', values: [{id: 0xf1cba0, label: 'Light'}, {id: 0xe8c39c, label: 'Fair'}, {id: 0xc9955f, label: 'Tan'}, {id: 0x8a5a33, label: 'Dark'}]},
  {key: 'shirt', label: 'Top', values: [{id: 0x3d6fb8, label: 'Blue'}, {id: 0x3f8f4f, label: 'Green'}, {id: 0x8c2f2f, label: 'Red'}, {id: 0x7a5a2a, label: 'Brown'}, {id: 0x8a8f98, label: 'Grey'}]},
  {key: 'pants', label: 'Trousers', values: [{id: 0x5c4a2a, label: 'Brown'}, {id: 0x2a3a5c, label: 'Navy'}, {id: 0x3a3a3a, label: 'Charcoal'}, {id: 0x6a4a8a, label: 'Plum'}]},
];
let look = {gender: 'male', hair: 'short', hairCol: 0x4a2a14, skin: 0xe8c39c, shirt: 0x3d6fb8, pants: 0x5c4a2a};
let lookMade = false;
try { const d = JSON.parse(localStorage.getItem('lowpolyLook')); if (d) { look = {...look, ...d.look}; lookMade = !!d.made; } } catch (e) {}
const saveLook = () => { try { localStorage.setItem('lowpolyLook', JSON.stringify({look, made: lookMade})); } catch (e) {} };

// ----- renderer, scene, camera -----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = 0xcfe6ea;
scene.background = new THREE.Color(HORIZON);
scene.fog = new THREE.Fog(HORIZON, 50, 120);
// a gradient sky dome with a soft sun glow
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x3d7fc9) }, mid: { value: new THREE.Color(0x8cc4e6) }, bot: { value: new THREE.Color(HORIZON) }, sunDir: { value: new THREE.Vector3(12, 22, 8).normalize() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 top, mid, bot, sunDir; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = h > 0.25 ? mix(mid, top, smoothstep(0.25, 0.9, h)) : mix(bot, mid, smoothstep(-0.05, 0.25, h));
      float s = max(dot(vP, sunDir), 0.0); c += vec3(1.0, 0.85, 0.6) * (pow(s, 64.0) * 0.9 + pow(s, 6.0) * 0.18);
      gl_FragColor = vec4(c, 1.0); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(180, 32, 16), skyMat);
scene.add(sky);
// soft puffy clouds drifting overhead
const clouds = new THREE.Group(); scene.add(clouds);
{
  const cm = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xdde8f0, emissiveIntensity: 0.35, flatShading: true, roughness: 1, fog: false });
  const cr = (() => { let q = 3; return () => (q = (q * 16807) % 2147483647) / 2147483647; })();
  for (let i = 0; i < 14; i++) {
    const c = new THREE.Group();
    for (let j = 0; j < 4 + cr() * 3; j++) {
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + cr() * 3, 0), cm);
      b.position.set(j * 4 - 6 + cr() * 2, cr() * 2, cr() * 3); b.scale.y = 0.55; c.add(b);
    }
    const a = cr() * Math.PI * 2, r = 70 + cr() * 60;
    c.position.set(Math.cos(a) * r, 45 + cr() * 15, Math.sin(a) * r); c.rotation.y = cr() * 3;
    clouds.add(c);
  }
}
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
let yaw = 0.6, pitch = 0.95, dist = 30;
const target = new THREE.Vector3(0, 1, 0);
function placeCamera(){
  camera.position.set(
    target.x + dist * Math.sin(yaw) * Math.sin(pitch),
    target.y + dist * Math.cos(pitch),
    target.z + dist * Math.cos(yaw) * Math.sin(pitch));
  camera.lookAt(target);
}
scene.add(new THREE.HemisphereLight(0xdff0ff, 0x4a5a2a, 0.9));
const sun = new THREE.DirectionalLight(0xffe7c2, 2.1);
sun.position.set(12, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 90 });
scene.add(sun, sun.target);
// keep the shadow area centred on the player and give new meshes shadows
const SUN_OFF = new THREE.Vector3(18, 33, 12);
let shadowScan = 0;
function updateSun(){
  sun.position.copy(target).add(SUN_OFF); sun.target.position.copy(target);
  if (performance.now() > shadowScan) {
    shadowScan = performance.now() + 1500;
    scene.traverse(o => { if (o.isMesh && !o.userData.shadowSet && o !== sky && o.parent !== clouds) {
      o.userData.shadowSet = true; o.castShadow = o !== groundMesh && o !== river; o.receiveShadow = true; } });
  }
}

const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9, metalness: 0 });
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const town = new THREE.Group();
scene.add(town);

// ----- the ground, a river, a bridge and paths -----
const groundGeo = new THREE.PlaneGeometry(240, 240, 240, 240);   // a fine grid so the hall's flat patch lines up
groundGeo.rotateX(-Math.PI / 2);
const gp = groundGeo.attributes.position;
for (let i = 0; i < gp.count; i++) {
  const x = gp.getX(i), z = gp.getZ(i);

  const inVillage = (x > -110 && x < 62 && z > -10 && z < 60);   // the village and its roads are flat, so the paths lie on the ground   // the village is flat, so grass cannot poke through the houses
  gp.setY(i, inHall || inVillage ? 0 : (Math.abs(z + 14) < 2.2 ? -0.3 : 0) + Math.sin(x * 0.2) * 0.12 + Math.cos(z * 0.17) * 0.12);
}

// tint the grass with gentle patches of light and dark green
{
  const cols = new Float32Array(gp.count * 3), c = new THREE.Color(), a = new THREE.Color(0x4f9a3c), b = new THREE.Color(0x7fae46), d = new THREE.Color(0x3c7a34);
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), z = gp.getZ(i);
    const n = Math.sin(x * 0.11 + Math.cos(z * 0.07) * 2) * 0.5 + Math.sin(z * 0.13 - x * 0.05) * 0.5;
    const f = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1;
    c.copy(a).lerp(n > 0 ? b : d, Math.abs(n) * 0.7).multiplyScalar(0.94 + f * 0.1);
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
}

// a textured material for a building part: the texture repeats over the part, and the colour tints it
function texMat(tex, rx, ry, color = 0xffffff){

// the houses: hollow walls with a doorway in the front, a floor, and a roof that lifts off while you are in.
// They are built in their own units and scaled to the hall; rot turns a house by a quarter or half turn.
const houses = [];
const HOUSE_SIZE = 2;   // houses are twice the size of the first ones
function house(x, z, w, d, wall, roofCol, rot = 0, furnish = null){
  const g = new THREE.Group();
  const S = HOUSE_SIZE; w = w * S; d = d * S;
  const t = 0.4, dw = 1.8 * S;   // wall thickness and doorway width, in the house's own units
  const walls = [[0, -d / 2, w / 2, t / 2], [-w / 2, 0, t / 2, d / 2], [w / 2, 0, t / 2, d / 2],
                 [-(w + dw) / 4, d / 2, (w - dw) / 4, t / 2], [(w + dw) / 4, d / 2, (w - dw) / 4, t / 2]];   // back, sides, front either side of the doorway
  walls.forEach(([cx, cz, hx, hz]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(hx * 2, 3 * S, hz * 2), texMat(wallStone, Math.max(1, hx), 1.5, wall));
    m.position.set(cx, 1.5 * S, cz); g.add(m);
  });
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(dw, 0.8 * S, t), texMat(wallStone, 1, 1, wall)); lintel.position.set(0, 2.6 * S, d / 2); g.add(lintel);
  // the door fills the doorway: it hangs from a pivot on the left jamb and swings open when clicked
  const doorPivot = new THREE.Group(); doorPivot.position.set(-dw / 2, 0, d / 2); g.add(doorPivot);
  const doorLeaf = new THREE.Mesh(new THREE.BoxGeometry(dw, 2.2 * S, 0.15), texMat(doorPlanks, 1, 1, 0x8a5a2a));
  doorLeaf.position.set(dw / 2, 1.1 * S, 0); doorPivot.add(doorLeaf);
  const knob = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 0.12), mat(0xd9b44a));
  knob.position.set(dw / 2 - 0.25, 0, 0.14); doorLeaf.add(knob);   // on the door face, near the free edge (positions are relative to the door's centre)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w - t, d - t).rotateX(-Math.PI / 2), texMat(floorWood, 2, 2, 0xc8a070));
  floor.position.y = 0.06; g.add(floor);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.7, 2.2 * S, 4), texMat(roofTex, 2, 2, roofCol));
  roof.position.y = 4.1 * S; roof.rotation.y = Math.PI / 4; g.add(roof);
  const k = HALL_SCALE, c = Math.cos(rot), sn = Math.sin(rot);
  g.scale.setScalar(k); g.position.set(x, 0, z); g.rotation.y = rot; town.add(g);
  const toWorld = (lx, lz) => ({ x: x + (lx * c + lz * sn) * k, z: z + (-lx * sn + lz * c) * k });
  walls.forEach(([cx, cz, hx, hz]) => {
    const p = toWorld(cx, cz);
    const ax = (Math.abs(c) * hx + Math.abs(sn) * hz) * k, az = (Math.abs(sn) * hx + Math.abs(c) * hz) * k;
    solidBoxes.push({ x0: p.x - ax, x1: p.x + ax, z0: p.z - az, z1: p.z + az });
  });
  const hw = (Math.abs(c) * w / 2 + Math.abs(sn) * d / 2) * k, hd = (Math.abs(sn) * w / 2 + Math.abs(c) * d / 2) * k;
  const h = { roof, x, z, hw, hd, k, toWorld, door: toWorld(0, d / 2 + 0.6) };   // the door is just outside the front
  houses.push(h);
  // the closed door blocks the doorway; opening it removes that block
  const dc = toWorld(0, d / 2);
  const dax = (Math.abs(c) * dw / 2 + Math.abs(sn) * t / 2) * k, daz = (Math.abs(sn) * dw / 2 + Math.abs(c) * t / 2) * k;
  const doorRec = { kind: 'door', x: dc.x, z: dc.z, s: 0.6, state: 'standing', pivot: doorPivot, leaf: doorLeaf, open: false,
    box: { x0: dc.x - dax, x1: dc.x + dax, z0: dc.z - daz, z1: dc.z + daz } };
  doorLeaf.userData = { action: 'Open', name: 'Door', rec: doorRec };
  h.doorRec = doorRec;
  doorRec.outside = h.door;
  doorRec.inside = toWorld(0, d / 2 - 1.3);   // a spot just inside the doorway
  trees.push(doorLeaf);
  solidBoxes.push(doorRec.box);

}

const seeded = (() => { let q = 11; return () => (q = (q * 16807) % 2147483647) / 2147483647; })();

  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

})();

// ----- pathfinding: a grid of half-unit cells, A* around every solid box -----
const PATH = { C: 0.5, X0: -120, Z0: -120, NX: 481, NZ: 481 };   // the whole ground, half a unit a cell

// A* over the grid. If the target cannot be reached, the route goes to the reachable cell nearest to it.
function findPath(fromV, toV){
  const { NX, NZ } = PATH;
  const sx = Math.round((fromV.x - PATH.X0) / PATH.C), sz = Math.round((fromV.z - PATH.Z0) / PATH.C);
  const gx = Math.min(NX - 1, Math.max(0, Math.round((toV.x - PATH.X0) / PATH.C)));
  const gz = Math.min(NZ - 1, Math.max(0, Math.round((toV.z - PATH.Z0) / PATH.C)));

  const free = new Uint8Array(NX * NZ);   // which cells the body fits in, worked out once for this search
  for (let iz = 0; iz < NZ; iz++) for (let ix = 0; ix < NX; ix++) free[iz * NX + ix] = blocked(cellX(ix), cellZ(iz)) ? 0 : 1;
  const usable = (ix, iz) => free[iz * NX + ix] === 1 || (Math.hypot(ix - sx, iz - sz) < 6 && !hardHit(cellX(ix), cellZ(iz)));

  const hpush = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const q = (k - 1) >> 1; if (heap[q][0] <= heap[k][0]) break; [heap[q], heap[k]] = [heap[k], heap[q]]; k = q; } };

  const pts = [];
  for (let c = target; c !== -1; c = from[c]) { const ix = c % NX, iz = (c - ix) / NX; pts.push({ x: cellX(ix), z: cellZ(iz) }); if (c === start) break; }

}
function walkStart(point, then, replan = false){

}
function creak(){
  try {

    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.4);

function openDoor(){ if (doorOpen) return; doorOpen = true; doorTargetAngle = Math.PI / 2; creak(); }

// walk to the door's near side, open it, walk through, then it shuts again a few seconds later
function useDoor(){
  if (!hero) return;
  const inside = hero.position.z < DOOR_WORLD.z;     // north of the door is inside the hall
  const front = inside ? INSIDE : OUTSIDE, beyond = inside ? OUTSIDE : INSIDE;
  walkStart(front, () => { openDoor(); walkStart(beyond, () => { doorCloseIn = 240; }); });
}
function updateDoor(){
  // while the adventurer is inside, the stone turns see-through so they can be seen
  if (hero) {
    const inside = Math.abs(hero.position.x - HALL.x) < 7 * HS && Math.abs(hero.position.z - HALL.z) < 6 * HS;
    hero.material.depthTest = true;   // the faded walls let you see through; the solid door still hides the character
    roofMesh.visible = !inside;   // the roof lifts away while you are inside, and comes back outside
    for (const m of hallWallMats) {
      m.opacity += (1 - m.opacity) * 0.12;   // walls stay solid; the roof lifts away instead
      m.transparent = m.opacity < 0.99;
      m.depthWrite = !m.transparent;
    }
  }
  doorPivot.rotation.y += (doorTargetAngle - doorPivot.rotation.y) * 0.2;   // the door eases open or shut
  if (doorOpen && doorCloseIn > 0) {
    const nearDoor = hero && Math.abs(hero.position.z - DOOR_WORLD.z) < 1.2 && Math.abs(hero.position.x - DOOR_WORLD.x) < 2;

}

const trees = [];   // the trees that can be clicked or hovered right now
const treeRecs = []; // every tree's state, standing or not
// ----- a tree built from our own shapes: a tapered trunk with root flares and a lumpy, leafy crown -----
// The crown's vertices are nudged by a hash of their position, so the blobs look uneven but still join up.
function makeTree(x, z, s = 1, oak = false){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.34 * s, 2.8 * s, 7), mat(0x5a3a1e));
  trunk.position.y = 1.4 * s; g.add(trunk);
  for (let i = 0; i < 4; i++) {                       // root flares at the base
    const a = i * Math.PI / 2 + 0.4;
    const root = new THREE.Mesh(new THREE.ConeGeometry(0.16 * s, 0.6 * s, 5), mat(0x4a2e16));
    root.position.set(Math.cos(a) * 0.3 * s, 0.18 * s, Math.sin(a) * 0.3 * s);
    root.rotation.set(Math.sin(a) * 0.9, 0, -Math.cos(a) * 0.9); g.add(root);
  }
  const greens = oak ? [0x3f6e2a, 0x4f7f32, 0x2e5a22, 0x5a8a3a] : [0x2f7a2c, 0x3d8f34, 0x26662a, 0x4a9e3a];
  const blobs = oak
    ? [[0, 0, 0, 1.7], [1.3, 0.3, 0.4, 1.4], [-1.2, 0.4, -0.3, 1.5], [0.2, 0.9, -1.2, 1.3], [-0.4, 1.1, 0.9, 1.3], [0.9, 1.4, -0.6, 1.1]]
    : [[0, 0, 0, 1.25], [0.9, 0.5, 0.3, 0.95], [-0.8, 0.6, -0.2, 1.0], [0.1, 0.9, -0.8, 0.9], [-0.3, 1.0, 0.7, 0.85], [0.6, 1.2, -0.5, 0.7]];
  blobs.forEach(([dx, dy, dz, r], i) => {
    const geo = new THREE.IcosahedronGeometry(r * s, 0);
    const pos = geo.attributes.position;
    for (let v = 0; v < pos.count; v++) {
      const px = pos.getX(v), py = pos.getY(v), pz = pos.getZ(v);
      const h = Math.sin(px * 12.9898 + py * 78.233 + pz * 37.719 + i * 1.7) * 43758.5453;
      const j = 0.85 + 0.3 * (h - Math.floor(h));
      pos.setXYZ(v, px * j, py * j, pz * j);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat(greens[i % greens.length]));
    m.position.set(dx * s, (2.5 + dy) * s, dz * s); g.add(m);
  });
  g.position.set(x, 0, z);                    // the origin is the base, so the tree falls over from its roots
  g.userData.action = 'Chop'; g.userData.name = oak ? 'Oak tree' : 'Tree';
  const h = Math.max(1, 0.35 * s);   // at least a 2x2 footprint, centred on the tree
  const box = { x0: x - h, x1: x + h, z0: z - h, z1: z + h };   // the trunk blocks walking
  const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * s, 0.36 * s, 0.5 * s, 7), mat(0x6b4a2a));
  stump.position.set(x, 0.25 * s, z); stump.visible = false; town.add(stump);
  const rec = { kind: 'tree', key: nodeKey(x, z), until: 0, g, x, z, s, box, stump, state: 'standing', t: 0, dir: 1, level: oak ? 15 : 1, xp: oak ? 40 : 25 };   // oaks need Woodcutting 15
  g.userData.rec = rec; treeRecs.push(rec);
  trees.push(g); town.add(g); solidBoxes.push(box);

}

// ----- sound: small sounds made with Web Audio, so there are no sound files to license -----
let audioCtx = null;
function audio(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
// all sound effects go through one gain, so the Sounds slider sets their volume
function sfxOut(ctx){
  if (!ctx.sfxBus) { ctx.sfxBus = ctx.createGain(); ctx.sfxBus.connect(ctx.destination); }
  ctx.sfxBus.gain.value = SETTINGS.sfxMute ? 0 : SETTINGS.sfx / 100;

}
function noiseBuffer(ctx, dur){
  const n = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
// a short wooden "thock": a band of noise plus a low knock
function chopSound(){
  const ctx = audio(); if (!ctx) return; const t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 0.2);
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 1.2;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  src.connect(bp); bp.connect(g); g.connect(sfxOut(ctx)); src.start(t); src.stop(t + 0.2);
  const o = ctx.createOscillator(), og = ctx.createGain();
  o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
  og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  o.connect(og); og.connect(sfxOut(ctx)); o.start(t); o.stop(t + 0.15);
}
// a sharp clink for striking stone
function clinkSound(){
  const ctx = audio(); if (!ctx) return; const t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 0.12);
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 3;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  src.connect(bp); bp.connect(g); g.connect(sfxOut(ctx)); src.start(t); src.stop(t + 0.12);
}
// the wood groaning as it starts to tip over
function creakSound(dur){
  const ctx = audio(); if (!ctx) return; const t = ctx.currentTime;
  const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.linearRampToValueAtTime(160, t + dur);
  lp.type = 'lowpass'; lp.frequency.value = 500;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22, t + dur * 0.5); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(lp); lp.connect(g); g.connect(sfxOut(ctx)); o.start(t); o.stop(t + dur + 0.05);
}
// the trunk hitting the ground: a deep thud with a little rustle
function fallSound(){
  const ctx = audio(); if (!ctx) return; const t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 0.6);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  src.connect(lp); lp.connect(g); g.connect(sfxOut(ctx)); src.start(t); src.stop(t + 0.6);
  const o = ctx.createOscillator(), og = ctx.createGain();
  o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.4);
  og.gain.setValueAtTime(0.7, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  o.connect(og); og.connect(sfxOut(ctx)); o.start(t); o.stop(t + 0.5);
}

// which arm pose a point in the swing shows: wind up (first 40%), strike (40-55%), recover (the rest)
function swingPose(p){
  if (p < 0.4) return 'up';
  if (p < 0.55) return 'down';
  return 'mid';
}

// a little brass fanfare: "duh duh du duhhhh"
function levelUpSound(){
  const ctx = audio(); if (!ctx) return; const t0 = ctx.currentTime + 0.02;
  const out = ctx.createGain(); out.gain.value = 0.22; out.connect(sfxOut(ctx));
  const notes = [[523.25, 0, 0.14], [523.25, 0.17, 0.14], [659.25, 0.34, 0.12], [783.99, 0.5, 1.1]];   // C C E G
  for (const [f, at, len] of notes) {
    for (const [mul, type, vol] of [[1, 'sawtooth', 0.5], [1.005, 'square', 0.25], [0.5, 'triangle', 0.6]]) {
      const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = type; o.frequency.value = f * mul; lp.type = 'lowpass'; lp.frequency.value = 2200;
      const s = t0 + at;
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s + 0.02);
      g.gain.setValueAtTime(vol * 0.8, s + len * 0.6); g.gain.exponentialRampToValueAtTime(0.001, s + len + 0.15);
      if (len > 0.5) { const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.5; lg.gain.value = 4; lfo.connect(lg); lg.connect(o.frequency); lfo.start(s + 0.2); lfo.stop(s + len + 0.2); }   // vibrato on the long note
      o.connect(lp); lp.connect(g); g.connect(out); o.start(s); o.stop(s + len + 0.2);
    }
  }
}
function cancelChop(){
  if (chop.rec && chop.rec.state === 'standing') chop.rec.g.rotation.z = 0;
  if (chop.rec && ONLINE.act) setAct(null);
  chop.rec = null;
}
// what you are doing right now, shared with the others (chop, mine, smelt, fish)
function setAct(a){ ONLINE.act = a; writePresence(true); }
function clickNode(rec){
  if (rec.state === 'felled') { showToast(`This ${rec.g && rec.g.userData ? rec.g.userData.name.toLowerCase() : 'node'} is gone for now. It will grow back soon.`); return; }
  if (rec.state === 'growing') { showToast('It is still growing back. Give it a moment.'); return; }
  if (rec.state === 'claiming') { showToast('Someone else is taking this right now.'); return; }
  if (rec.state !== 'standing') return;
  cancelChop();
  if (rec.kind === 'anvil' && !hasItem('Hammer')) { showToast('You need a hammer to work the metal.'); return; }
  if (rec.kind === 'anvil' || rec.kind === 'npc' || rec.kind === 'fish' || rec.kind === 'door') { /* no tool needed */ }
  else if (rec.kind === 'furnace') { if (!hasItem('Copper ore') || !hasItem('Tin ore')) { showToast('Smelting needs copper ore and tin ore.'); return; } }
  else if (rec.kind === 'rock') { if (!hasItem(PICK_NAME)) { showToast('You need a pickaxe to mine this rock.'); return; } }
  else if (!hasItem(AXE_NAME)) { showToast('You need an axe to chop this tree.'); return; }
  if (rec.kind === 'door') {
    // approach from whichever side the adventurer is on
    const d2 = q => Math.hypot(q.x - hero.position.x, q.z - hero.position.z);
    const q = d2(rec.inside) < d2(rec.outside) ? rec.inside : rec.outside;
    walkStart(new THREE.Vector3(q.x, 0, q.z), () => toggleDoor(rec)); return;
  }
  if (rec.kind === 'tree' && levelOf(SKILL_XP.Woodcutting) < rec.level) { showToast(`You need Woodcutting ${rec.level} to chop this ${rec.g.userData.name.toLowerCase()}.`); return; }
  // stand on the side of the node that is free and nearest to the adventurer
  const spots = [[2.4, 0], [-2.4, 0], [0, 2.4], [0, -2.4]]
    .map(([dx, dz]) => ({ x: rec.x + dx * rec.s, z: rec.z + dz * rec.s }))
    .filter(p => !blocked(p.x, p.z))
    .sort((a, b) => Math.hypot(a.x - hero.position.x, a.z - hero.position.z) - Math.hypot(b.x - hero.position.x, b.z - hero.position.z));
  if (!spots.length) return;
  walkStart(new THREE.Vector3(spots[0].x, 0, spots[0].z), () => { if (rec.kind === 'furnace') smelt(rec); else if (rec.kind === 'anvil') openSmithing(); else if (rec.kind === 'npc') openDialog(rec); else if (rec.kind === 'fish') catchFish(); else if (rec.kind === 'door') toggleDoor(rec); else { chop.rec = rec; chop.t = 0; setAct({ k: rec.kind === 'rock' ? 'mine' : 'chop', n: rec.key, t: Date.now() }); } });
}

}

  if (bag.length >= BAG_SIZE && !hasItem('Bronze bar')) { showToast('Your bag is full.'); return; }   // check room before taking the ores

}

function makeGear(r){
  if (!hasItem('Hammer')) { showToast('You need a hammer to work the metal.'); return; }
  if (levelOf(SKILL_XP.Smithing) < r.level) { showToast(`You need Smithing ${r.level} to make a ${r.name.toLowerCase()}.`); return; }
  if (barCount() < r.bars) { showToast(`You need ${r.bars} bronze bar${r.bars > 1 ? 's' : ''}.`); return; }
  if (bag.length >= BAG_SIZE && !hasItem(r.name)) { showToast('Your bag is full.'); return; }
  for (let i = 0; i < r.bars; i++) removeItem('Bronze bar');
  addItem(r.name, 1, ITEMS[r.name].icon); addXp('Smithing', r.xp);
  showToast(`You make a ${r.name.toLowerCase()}.  +${r.xp} Smithing XP`);
  renderSmith();
}
function equip(name){
  const def = ITEMS[name], old = equipped[def.slot];
  removeItem(name);
  if (old) addItem(old, 1, ITEMS[old].icon);   // the piece it replaces goes back to the bag
  equipped[def.slot] = name;
  heroFrame = '';   // redraw the sprite with the new gear
  renderBag(); renderStats(); renderGear();
  showToast(`Equipped ${name.toLowerCase()}.`);
}
function gearBonus(stat){
  return Object.values(equipped).reduce((t, n) => t + (n && ITEMS[n][stat] ? ITEMS[n][stat] : 0), 0);
}

// ----- Mara's shop: tools for coins -----
const SHOP = [{ name: 'Bronze axe', price: 20 }, { name: 'Bronze pickaxe', price: 20 }, { name: 'Hammer', price: 10 }];
function openShop(){ document.getElementById('shopPanel').hidden = false; renderShop(); }
function coinCount(){ const c = bag.find(i => i.name === 'Coins'); return c ? c.qty : 0; }
// what Mara buys: logs, ores, bars and the bronze weapons and shield, for coins
const SELL = { 'Logs': 4, 'Copper ore': 3, 'Tin ore': 3, 'Bronze bar': 8, 'Bronze dagger': 10, 'Bronze sword': 25, 'Bronze shield': 25 };
function countOf(name){ const it = bag.find(i => i.name === name); return it ? it.qty : 0; }
// how many of each item Mara has been sold lately: each sale lowers her price, and it recovers over time
const DEMAND = {};   // name -> { n, t }
function demandNow(name){ const d = DEMAND[name]; return d ? Math.max(0, d.n - Math.floor((Date.now() - d.t) / 90000)) : 0; }   // one sale fades every 90 seconds
function sellPrice(name, extra = 0){ const f = Math.max(0.4, 1 - 0.05 * (demandNow(name) + extra)); return Math.max(1, Math.round(SELL[name] * f)); }
function sellQuote(name, n){ let t = 0; for (let i = 0; i < n; i++) t += sellPrice(name, i); return t; }   // each unit in a big sale pays a little less
function renderShop(){
  const buyRows = SHOP.map((it, i) => `<div style="display:flex;align-items:center;gap:8px;padding:5px 0">${ICON_FOR[it.name]}
    <span style="flex:1">${it.name}<br><small style="color:#c9b27a">${it.price} coins</small></span>
    <button data-s="${i}" style="font:inherit;background:#1d150b;color:#e8efe6;border:1px solid #5b4324;border-radius:5px;padding:3px 10px;cursor:pointer">Buy</button></div>`).join('');
  const sellRows = Object.keys(SELL).filter(n => countOf(n) > 0).map(n => `<div style="display:flex;align-items:center;gap:6px;padding:5px 0">${ICON_FOR[n]}
    <span style="flex:1">${n}<br><small style="color:#c9b27a">x${countOf(n)} &middot; ${sellPrice(n)} each now <span style="opacity:.7">(base ${SELL[n]})</span></small></span>
    <button data-sell="${n}|1" style="font:inherit;background:#1d150b;color:#e8efe6;border:1px solid #5b4324;border-radius:5px;padding:3px 8px;cursor:pointer">Sell 1</button>
    <button data-sell="${n}|all" style="font:inherit;background:#1d150b;color:#e8efe6;border:1px solid #5b4324;border-radius:5px;padding:3px 8px;cursor:pointer">All</button></div>`).join('')
    || '<div style="color:#c9b27a;padding:5px 0">Bring me logs, ores, bars or your bronze gear.</div>';
  document.getElementById('shopList').innerHTML = `<div style="color:#f0c35a;margin-top:2px">Buy</div>${buyRows}
    <div style="color:#f0c35a;margin-top:10px">Sell to Mara</div>${sellRows}
    <div style="margin-top:8px;color:#c9b27a">You have ${coinCount()} coins.</div>`;
}
// sell some of an item to Mara for coins
function sellItem(name, all){
  const have = countOf(name);
  if (!have) { showToast(`You have no ${name.toLowerCase()} to sell.`); return; }
  if (!hasItem('Coins') && bag.length >= BAG_SIZE) { showToast('Your bag is full, so there is no room for the coins.'); return; }
  const n = all ? have : 1;
  const coins = sellQuote(name, n);
  for (let k = 0; k < n; k++) removeItem(name);
  DEMAND[name] = { n: demandNow(name) + n, t: Date.now() };
  addItem('Coins', coins, COIN_ICON);
  showToast(`You sell ${n} ${name.toLowerCase()} for ${coins} coins.`);
  renderShop(); renderBag();
}
function buyItem(it){
  if (hasItem(it.name)) { showToast(`You already have a ${it.name.toLowerCase()}.`); return; }
  if (coinCount() < it.price) { showToast(`A ${it.name.toLowerCase()} costs ${it.price} coins. You have ${coinCount()}.`); return; }
  if (bag.length >= BAG_SIZE) { showToast('Your bag is full, so there is no room for another item.'); return; }
  for (let i = 0; i < it.price; i++) removeItem('Coins');
  addItem(it.name, 1, ICON_FOR[it.name]);
  showToast(`You buy a ${it.name.toLowerCase()} for ${it.price} coins.`);
  renderShop();
}

// ----- village music: a soft loop made from synthesised notes (no sound files) -----
const MUSIC = { master: null, timer: 0, nextTime: 0, step: 0, mel: 4 };
// the volume settings, saved in this browser
const SETTINGS = { music: 50, sfx: 80, musicMute: false, sfxMute: false };
try { Object.assign(SETTINGS, JSON.parse(localStorage.getItem('itapSettings')) || {}); } catch (e) {}
const musicLevel = () => SETTINGS.musicMute ? 0 : SETTINGS.music / 100;
const MUSIC_BEAT = 60 / 76 / 2;                         // an eighth note at 76 beats a minute
const MUSIC_BASS = [146.83, 123.47, 196.0, 220.0];      // the chords: D, B minor, G, A
const MUSIC_NOTES = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99, 880];   // D major pentatonic
function musicPad(root, t, dur){
  const ctx = audio(); if (!ctx || !MUSIC.master) return;
  [root, root * 1.5].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = f * (i ? 1.002 : 0.998);
    lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(MUSIC.master); o.start(t); o.stop(t + dur + 0.05);
  });
}
function musicNote(f, t){
  const ctx = audio(); if (!ctx || !MUSIC.master) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  o.connect(g); g.connect(MUSIC.master); o.start(t); o.stop(t + 0.75);
}
// schedule a little ahead of the audio clock: a chord each bar, and a melody that wanders up and down the scale
function musicTick(){
  const ctx = audio(); if (!ctx || !MUSIC.master) return;
  while (MUSIC.nextTime < ctx.currentTime + 0.4) {
    const t = MUSIC.nextTime, bar = Math.floor(MUSIC.step / 8) % 4, pos = MUSIC.step % 8;
    if (pos === 0) musicPad(MUSIC_BASS[bar], t, MUSIC_BEAT * 8);
    if (pos % 2 === 0 && Math.random() < 0.7) {
      MUSIC.mel = Math.min(MUSIC_NOTES.length - 1, Math.max(0, MUSIC.mel + [-1, -1, 0, 1, 1, 2, -2][Math.floor(Math.random() * 7)]));
      musicNote(MUSIC_NOTES[MUSIC.mel], t);
    }
    MUSIC.nextTime += MUSIC_BEAT; MUSIC.step++;
  }
}
function startMusic(){
  if (MUSIC.master) return;
  const ctx = audio(); if (!ctx) return;
  MUSIC.master = ctx.createGain(); MUSIC.master.gain.value = musicLevel(); MUSIC.master.connect(ctx.destination);
  MUSIC.nextTime = ctx.currentTime + 0.1;
  MUSIC.timer = setInterval(musicTick, 150);
}
const SPEAKER = muted => `<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#c9b27a"/>${muted
  ? '<path d="M11 5.5l4 5M15 5.5l-4 5" stroke="#d64b3c" stroke-width="1.6"/>'
  : '<path d="M11 5.5q2 2.5 0 5M12.8 3.8q3.5 4.2 0 8.4" fill="none" stroke="#c9b27a" stroke-width="1.3"/>'}</svg>`;
function applySettings(){
  if (MUSIC.master) MUSIC.master.gain.value = musicLevel();
  if (audioCtx) sfxOut(audioCtx);
  for (const [k, id] of [['music', 'Music'], ['sfx', 'Sfx']]) {
    const m = SETTINGS[k + 'Mute'], b = document.getElementById('mute' + id);

    document.getElementById('vol' + id).value = SETTINGS[k];

  try { localStorage.setItem('itapSettings', JSON.stringify(SETTINGS)); } catch (e) {}
}
for (const [k, id] of [['music', 'Music'], ['sfx', 'Sfx']]) {

}

// where a point in the world lands across the screen (-1 left, +1 right), so facing matches what the camera shows
const screenV = new THREE.Vector3();
function screenX(x, z){ screenV.set(x, 1, z).project(camera); return screenV.x; }
function updateTrees(){
  const now = Date.now();
  for (const rec of treeRecs) {
    if (rec.state === 'felled' && (!rec.until || rec.until <= now)) regrowNode(rec);   // the shared timer is up: grow back
    if (rec.state === 'growing') {
      rec.t++;
      const k = Math.min(1, rec.t / 60), e = 1 - Math.pow(1 - k, 3);
      rec.g.scale.setScalar(0.05 + 0.95 * e);
      if (k >= 1) rec.state = 'standing';
    } else if (rec.state === 'falling') {
      rec.t++;
      const k = Math.min(1, rec.t / 40);
      rec.g.rotation.z = rec.dir * (Math.PI / 2) * k * k;
      if (k >= 1) { hideNode(rec); fallSound(); if (rec.remoteFall) rec.remoteFall = false; else giveLogs(rec); }
    }
  }
  if (chop.rec) {
    const rec = chop.rec;
    if (rec.state !== 'standing') { chop.rec = null; return; }
    chop.t++;
    rec.g.rotation.z = Math.sin(chop.t * 0.5) * 0.025;   // the node shakes under each blow
    const phase = (chop.t % 45) / 45;              // one full swing every 45 frames
    const facing = screenX(rec.x, rec.z) < screenX(hero.position.x, hero.position.z) ? -1 : 1;   // face the node as the camera sees it
    setHeroFrame(0, facing, swingPose(phase), rec.kind === 'rock' ? 'pick' : 'axe');   // the arm winds up, strikes, and recovers
    if (chop.t % 45 === 25) { if (rec.kind === 'rock') clinkSound(); else chopSound(); }   // the blow lands as the tool comes down
    if (chop.t >= CHOP_FRAMES) {
      // the node is claimed on the server first: if someone else got there, nothing falls
      chop.rec = null; rec.g.rotation.z = 0; rec.state = 'claiming'; setAct(null);
      claimNode(rec).then(until => {
        if (!until) { rec.state = 'standing'; showToast(ONLINE.ok ? 'Someone got there first.' : "Can't reach the village."); return; }
        rec.until = until;
        if (rec.kind === 'rock') mineDone(rec);
        else { rec.state = 'falling'; rec.t = 0; rec.dir = hero.position.x < rec.x ? -1 : 1; creakSound(0.7); }
      });
    }
  }
}
// a node that is down: hidden, with its stump showing
function hideNode(rec){
  rec.state = 'felled';
  rec.g.visible = false; rec.g.rotation.z = 0;
  const i = solidBoxes.indexOf(rec.box); if (i >= 0) solidBoxes.splice(i, 1);
  const j = trees.indexOf(rec.g); if (j >= 0) trees.splice(j, 1);
  rec.stump.visible = true;
}
// a node growing back from a sapling
function regrowNode(rec){
  rec.g.visible = true; rec.g.rotation.z = 0; rec.g.scale.setScalar(0.05);
  rec.stump.visible = false; solidBoxes.push(rec.box); trees.push(rec.g);
  rec.state = 'growing'; rec.t = 0;
}
// the shared state from the database: nodes someone else took are hidden here too
function applyNodeStates(nodes, animate){
  const now = Date.now();
  for (const rec of treeRecs) {
    const n = nodes && nodes[rec.key];
    rec.until = n && n.until ? n.until : 0;
    if (!(rec.until > now && (rec.state === 'standing' || rec.state === 'growing'))) continue;
    if (!animate) hideNode(rec);   // the state when we join: no effects
    else if (rec.state === 'standing' && rec.kind === 'rock') { burstRock(rec); explosionSound(); hideNode(rec); }
    else if (rec.state === 'standing') { rec.remoteFall = true; rec.state = 'falling'; rec.t = 0; rec.dir = hero.position.x < rec.x ? -1 : 1; creakSound(0.7); }
    else hideNode(rec);
  }
}
function giveLogs(rec){
  if (addItem('Logs', 1, LOG_ICON)) { addXp('Woodcutting', rec.xp); showToast(`You get some logs.  +${rec.xp} Woodcutting XP`); }
  else showToast('Your bag is full.');
}
// a rock that has been mined leaves rubble, gives ore, and comes back later
function mineDone(rec){
  burstRock(rec); explosionSound();
  hideNode(rec);
  const oreName = ORES[rec.ore].item, icon = rec.ore === 'tin' ? TIN_ICON : ORE_ICON;
  if (addItem(oreName, 1, icon)) { addXp('Mining', 20); showToast(`You get some ${oreName.toLowerCase()}.  +20 Mining XP`); }
  else showToast('Your bag is full.');
}

// ----- the rock smash: the rock breaks into chunks and dust that fly out, bounce, and fade -----
const debris = [];   // { mesh, vel, life, max, grav, spin, s, dust }
function burstRock(rec){
  const cx = rec.x, cz = rec.z, s = rec.s;
  const stone = [0x6e6a62, 0x5c5850, 0x7d786f, 0x67635b, ...ORES[rec.ore].veins];   // the chunks take the ore's colours
  for (let i = 0; i < 12; i++) {
    const size = (0.12 + Math.random() * 0.2) * s;
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0), mat(stone[i % stone.length]));
    m.position.set(cx + (Math.random() - 0.5) * 0.4 * s, 0.6 * s, cz + (Math.random() - 0.5) * 0.4 * s);
    scene.add(m);
    const a = Math.random() * Math.PI * 2, sp = (0.035 + Math.random() * 0.045) * s;
    debris.push({ mesh: m, vel: new THREE.Vector3(Math.cos(a) * sp, 0.1 + Math.random() * 0.1, Math.sin(a) * sp),
      life: 150 + Math.random() * 60, max: 210, grav: 0.012, spin: (Math.random() - 0.5) * 0.3, s: size, dust: false });
  }
  for (let i = 0; i < 6; i++) {                       // a puff of dust that spreads and fades
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.25 * s, 8, 6), new THREE.MeshBasicMaterial({ color: 0xbdb6a8, transparent: true, opacity: 0.7, depthWrite: false }));
    m.position.set(cx, 0.4 * s, cz); scene.add(m);
    const a = Math.random() * Math.PI * 2, sp = (0.012 + Math.random() * 0.015) * s;
    debris.push({ mesh: m, vel: new THREE.Vector3(Math.cos(a) * sp, 0.01, Math.sin(a) * sp), life: 60, max: 60, grav: 0, spin: 0, s: 0.25 * s, dust: true });
  }
}
function updateDebris(){
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.life--;
    d.mesh.position.add(d.vel);
    if (!d.dust) {
      d.vel.y -= d.grav;
      if (d.mesh.position.y < d.s * 0.5) { d.mesh.position.y = d.s * 0.5; d.vel.y *= -0.4; d.vel.x *= 0.6; d.vel.z *= 0.6; }   // bounce and slow down
      d.mesh.rotation.x += d.spin; d.mesh.rotation.y += d.spin * 0.7;
      if (d.life < 40) d.mesh.scale.setScalar(Math.max(0.01, d.life / 40));
    } else {
      const k = 1 - d.life / d.max;
      d.mesh.scale.setScalar(1 + k * 0.8); d.mesh.material.opacity = 0.7 * (1 - k);
    }
    if (d.life <= 0) { scene.remove(d.mesh); d.mesh.geometry.dispose(); d.mesh.material.dispose(); debris.splice(i, 1); }
  }
}
// the blast: a crack of noise that drops into a low rumble, a boom, then stone pieces clattering down
function explosionSound(){
  const ctx = audio(); if (!ctx) return; const t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 0.8);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2500, t); lp.frequency.exponentialRampToValueAtTime(180, t + 0.7);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  src.connect(lp); lp.connect(g); g.connect(sfxOut(ctx)); src.start(t); src.stop(t + 0.8);
  const o = ctx.createOscillator(), og = ctx.createGain();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.5);
  og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

// ----- a copper ore rock: grey-brown stone with copper veins, built from our own shapes -----
const ORES = {
  copper: { label: 'Copper rock', item: 'Copper ore', veins: [0xc2652b, 0xd9773a] },
  tin:    { label: 'Tin rock',    item: 'Tin ore',    veins: [0xb8c4cc, 0xdfe6ea] }
};
function makeRock(x, z, s = 1, ore = 'copper'){
  const g = new THREE.Group();
  const stone = [0x6e6a62, 0x5c5850, 0x7d786f, 0x67635b];
  const lumps = [[0, 0.55, 0, 0.9], [0.7, 0.4, 0.3, 0.6], [-0.6, 0.35, -0.3, 0.55], [0.1, 0.3, 0.8, 0.5]];
  lumps.forEach(([dx, dy, dz, r], i) => {
    const geo = new THREE.IcosahedronGeometry(r * s, 0);
    const pos = geo.attributes.position;
    for (let v = 0; v < pos.count; v++) {
      const px = pos.getX(v), py = pos.getY(v), pz = pos.getZ(v);
      const h = Math.sin(px * 12.9898 + py * 78.233 + pz * 37.719 + i * 1.7) * 43758.5453;
      const j = 0.85 + 0.3 * (h - Math.floor(h));
      pos.setXYZ(v, px * j, py * j, pz * j);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat(stone[i]));
    m.position.set(dx * s, dy * s, dz * s); g.add(m);
  });
  // the copper veins: small orange-brown chunks set into the stone
  [[0.5, 0.9, 0.5], [-0.3, 0.8, 0.6], [0.2, 0.7, -0.6], [-0.7, 0.5, -0.1], [0.8, 0.45, -0.1]].forEach(([dx, dy, dz], i) => {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16 * s, 0), mat(ORES[ore].veins[i % 2]));
    m.position.set(dx * s, dy * s, dz * s); g.add(m);
  });
  // the rubble left behind after mining
  const rubble = new THREE.Mesh(new THREE.DodecahedronGeometry(0.55 * s, 0), mat(0x5c5850));
  rubble.scale.set(1, 0.35, 0.9); rubble.position.set(x, 0.12 * s, z); rubble.visible = false; town.add(rubble);
  g.position.set(x, 0, z);
  g.userData.action = 'Mine'; g.userData.name = ORES[ore].label;
  const h = Math.max(1, 0.7 * s);   // at least a 2x2 footprint, centred on the rock
  const box = { x0: x - h, x1: x + h, z0: z - h, z1: z + h };   // the rock blocks walking
  const rec = { kind: 'rock', key: nodeKey(x, z), until: 0, ore, g, x, z, s, box, stump: rubble, state: 'standing', t: 0, dir: 1 };
  g.userData.rec = rec; treeRecs.push(rec);
  trees.push(g); town.add(g); solidBoxes.push(box);
  return g;
}

function finishSprite(L, step){

// a smooth dirt path through the given points: a curved ribbon of the dirt texture, with a round patch at each end
const pathEdgeSpots = [];
function roadPath(pts, w = 2.2){
  const curve = new THREE.CatmullRomCurve3(pts.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
  const len = curve.getLength(), n = Math.max(2, Math.ceil(len / 0.6));
  const sp = curve.getSpacedPoints(n), pos = [], uv = [], idx = [];
  let along = 0;
  for (let i = 0; i <= n; i++) {
    const a = sp[Math.max(0, i - 1)], b = sp[Math.min(n, i + 1)];
    const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) || 1, nx = -dz / L, nz = dx / L;
    if (i) along += sp[i].distanceTo(sp[i - 1]);
    const hw = w / 2 * (1 + Math.sin(along * 0.7) * 0.08);   // the width wanders a little
    pos.push(sp[i].x + nx * hw, 0.04, sp[i].z + nz * hw, sp[i].x - nx * hw, 0.04, sp[i].z - nz * hw);
    uv.push(0, along / 4, 1, along / 4);
    if (i < n) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    if (i % 3 === 0) pathEdgeSpots.push([sp[i].x, sp[i].z, nx, nz, w]);
    if (i) ROADS.push([sp[i - 1].x, sp[i - 1].z, sp[i].x, sp[i].z]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo.setIndex(idx);
  geo.computeVertexNormals();
  if (geo.attributes.normal.getY(0) < 0) { for (let i = 0; i < idx.length; i += 3) [idx[i + 1], idx[i + 2]] = [idx[i + 2], idx[i + 1]]; geo.setIndex(idx); geo.computeVertexNormals(); }
  const m = new THREE.Mesh(geo, dirtMat); m.renderOrder = 1; town.add(m);
  for (const e of [pts[0], pts[pts.length - 1]]) {   // soft round ends, so joins and doorsteps look worn in
    const c = new THREE.Mesh(new THREE.CircleGeometry(w * 0.62, 20).rotateX(-Math.PI / 2), dirtMat);
    c.position.set(e[0], 0.042, e[1]); c.renderOrder = 1; town.add(c);
  }
}

function roadPath(pts, w = 2.2){

    const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) || 1, nx = -dz / L, nz = dx / L;

    uv.push(0, along / 4, 1, along / 4);
    if (i < n) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    if (i % 3 === 0) pathEdgeSpots.push([sp[i].x, sp[i].z, nx, nz, w]);

  roadPath([G, [-34, -2], [-36, -9.5]]);                               // north to the fishing bank

// random oaks through the village: a seeded spread, kept clear of buildings, roads, the hall, the well and the river
function scatterOaks(){
  const rand = (() => { let q = 2024; return () => (q = (q * 16807) % 2147483647) / 2147483647; })();
  const segDist = (px, pz, [x1, z1, x2, z2]) => {
    const dx = x2 - x1, dz = z2 - z1, L = dx * dx + dz * dz || 1;
    const t = Math.max(0, Math.min(1, ((px - x1) * dx + (pz - z1) * dz) / L));
    return Math.hypot(px - (x1 + t * dx), pz - (z1 + t * dz));
  };
  const clear = (x, z) => {
    if (x < -100 || x > 52 || z < -8 || z > 58) return false;
    if (solidBoxes.some(b => x > b.x0 - 2.5 && x < b.x1 + 2.5 && z > b.z0 - 2.5 && z < b.z1 + 2.5)) return false;   // houses, nodes, the well
    if (x > 2 && x < 32 && z > -9 && z < 15) return false;      // the hall and its doorway
    if (ROADS.some(r => segDist(x, z, r) < 2.8)) return false;   // roads
    if (oakSpots.some(o => Math.hypot(o[0] - x, o[1] - z) < 4)) return false;   // oaks keep a little room between them
    return true;
  };
  // three oaks, just south of the spawn hall
  const oakSpots = [[9, 17], [19, 18], [13, 22]];
  oakSpots.forEach(([x, z]) => makeTree(x, z, 1.5, true));
  // the rest of the village trees are ordinary trees
  let placed = 0, tries = 0;
  while (placed < 21 && tries < 4000) {
    tries++;
    const x = -100 + rand() * 152, z = -8 + rand() * 66;
    if (!clear(x, z)) continue;
    makeTree(x, z, 1.4 + rand() * 0.3, false);
    placed++;
  }
}

  if (d && d.xp && d.v === 2) Object.keys(SKILL_XP).forEach(k => { if (typeof d.xp[k] === 'number') SKILL_XP[k] = d.xp[k]; });   // skills from older saves are ignored
  if (d && d.look) { look = { ...look, ...d.look }; lookMade = true; saveLook(); creator.hidden = true; rebuildHero(); }
  if (d && d.pos && hero) { const sp = openSpotNear(d.pos.x, d.pos.z); hero.position.set(sp.x, 0, sp.z); heroShadow.position.set(sp.x, 0.06, sp.z); }   // back where you logged out
  renderBag(); renderStats(); renderGear();
}
async function saveNow(keepalive){
  if (!ONLINE.ready) return;
  const j = JSON.stringify(currentSave());
  if (j === ONLINE.saveJson && !keepalive) return;
  ONLINE.saveJson = j;
  try { await fetch(`${DB}/adventure/saves/${ONLINE.id}.json`, { method: 'PUT', keepalive: !!keepalive, body: j }); } catch (e) {}
}
// your own position, look and chat, shared with the others
function writePresence(force){
  if (!ONLINE.ready || !hero) return;
  const x = +hero.position.x.toFixed(2), z = +hero.position.z.toFixed(2);
  const sig = [x, z, heroFacing, walkTarget ? 1 : 0, ONLINE.chatK, JSON.stringify(look), JSON.stringify(ONLINE.act)].join('|');
  const now = Date.now();
  if (!force && sig === ONLINE.sig && now - ONLINE.lastWrite < 2000) return;
  if (!force && now - ONLINE.lastWrite < 100) return;
  ONLINE.sig = sig; ONLINE.lastWrite = now;
  const body = { n: ONLINE.name, x, z, f: heroFacing, w: walkTarget ? 1 : 0, l: look, c: ONLINE.chat || null, a: ONLINE.act || null, t: now };
  fetch(`${DB}/adventure/players/${ONLINE.id}.json`, { method: 'PUT', body: JSON.stringify(body), keepalive: force }).catch(() => {});
}
function sendChat(text){
  ONLINE.chatK++;
  ONLINE.chat = { t: text.slice(0, 120), k: ONLINE.chatK };
  writePresence(true);
}
// claim a shared node before it falls: only one player wins, and the server says who
async function claimNode(rec){
  if (!ONLINE.ready) return null;
  const url = `${DB}/adventure/nodes/${rec.key}.json`;
  try {
    const r = await fetch(url, { headers: { 'X-Firebase-ETag': 'true' } });
    const etag = r.headers.get('ETag'), cur = await r.json();
    if (cur && cur.until > Date.now()) return null;
    const until = Date.now() + REGROW_MS;
    const w = await fetch(url, { method: 'PUT', headers: { 'If-Match': etag, 'Content-Type': 'application/json' }, body: JSON.stringify({ until, by: ONLINE.id }) });
    return w.ok ? until : null;
  } catch (e) { return null; }
}
// the other players: a sprite with their look, and their name above it
function setRemote(id, p){
  if (!p || id === ONLINE.id) return;
  if (p.t && Date.now() - p.t > 30000) { removeRemote(id); return; }   // a left-behind entry from a closed browser
  let r = remote[id];
  if (!r) {
    // a join line only after the first list, and not again for someone who was just here (a briefly stale entry is not a new arrival)
    if (ONLINE.announce && !(joinSeen[id] && Date.now() - joinSeen[id] < 600000)) addSystemLine(`${p.n || 'A player'} has joined the village.`);
    joinSeen[id] = Date.now();
    const lookJson = JSON.stringify(p.l || {});
    const frames = [0, 1, 2, 3].map(f => { const t = new THREE.CanvasTexture(adventurerCanvas(p.l || look, f)); t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; });
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: frames[0], transparent: true, alphaTest: 0.5 }));
    sprite.center.set(0.5, 0); sprite.scale.set(3, 4, 1); sprite.renderOrder = 9;
    scene.add(sprite);
    const label = document.createElement('div');
    label.style.cssText = 'position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:6;color:#fff;font:13px Georgia,serif;text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000;white-space:nowrap;display:none;';
    const bubbleEl = document.createElement('div');
    bubbleEl.className = 'chatBub'; bubbleEl.style.display = 'none';
    document.body.append(label, bubbleEl);
    r = remote[id] = { sprite, frames, label, bubbleEl, lookJson, tx: p.x, tz: p.z, face: 1, walk: 0, tick: 0, k: p.c ? p.c.k : 0, bubbleTimer: 0, name: '', seen: 0, swing: makeSwing(p.l || look), act: null, actJson: 'null', actAt: 0, verb: '' };
    sprite.position.set(p.x, 0, p.z);
  }
  if (JSON.stringify(p.l || {}) !== r.lookJson) {   // the look changed: redraw the frames
    r.lookJson = JSON.stringify(p.l || {});
    r.frames.forEach((t, f) => { t.image = adventurerCanvas(p.l || look, f); t.needsUpdate = true; });
    refreshSwing(r, p.l || look);
  }
  r.name = p.n || 'Traveller';
  r.label.textContent = r.name;
  r.tx = p.x; r.tz = p.z;
  r.face = p.f === -1 ? -1 : 1;
  const aj = JSON.stringify(p.a || null);
  if (aj !== r.actJson) { r.actJson = aj; r.act = p.a || null; r.actAt = performance.now(); }
  r.seen = performance.now();
  if (p.c && p.c.k !== r.k) {   // a new line from them
    addChatLine(r.name, p.c.t, '#ffffff');
    sayRemote(r, p.c.t);
    r.k = p.c.k;
  }
}
function removeRemote(id){
  const r = remote[id]; if (!r) return;
  joinSeen[id] = Date.now();
  scene.remove(r.sprite); r.sprite.material.dispose();
  r.frames.forEach(t => t.dispose());
  r.swing.axe.concat(r.swing.pick).forEach(t => t.dispose());
  r.label.remove(); r.bubbleEl.remove();
  delete remote[id];
}
// the side-view swing frames for a look, with the axe and with the pickaxe
const SWING_POSES = ['up', 'down', 'mid'];
function makeSwing(a){
  const out = {};
  for (const tool of ['axe', 'pick']) out[tool] = SWING_POSES.map(pose => { const t = new THREE.CanvasTexture(adventurerSide({ ...look, ...a }, 0, pose, tool)); t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; });
  return out;
}
function refreshSwing(r, a){
  for (const tool of ['axe', 'pick']) SWING_POSES.forEach((pose, i) => { r.swing[tool][i].image = adventurerSide({ ...look, ...a }, 0, pose, tool); r.swing[tool][i].needsUpdate = true; });
}
let nodeMap = null;
function nodeRecByKey(k){ if (!nodeMap) { nodeMap = {}; treeRecs.forEach(rc => { nodeMap[rc.key] = rc; }); } return nodeMap[k]; }
const ACT_LABEL = { chop: 'chopping', mine: 'mining', smelt: 'smelting', fish: 'fishing' };
const ACT_TIME = { chop: 3600, mine: 3600, smelt: 2200, fish: 2200 };
// a grey line in the chat for things that happen in the village (not from a player)
function addSystemLine(text){
  const line = document.createElement('div');
  const body = document.createElement('i'); body.textContent = text; body.style.color = '#c9b27a';
  line.append(body); chatLog.appendChild(line);
  while (chatLog.children.length > 60) chatLog.removeChild(chatLog.firstChild);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function sayRemote(r, text){
  r.bubbleEl.textContent = text; r.bubbleEl.style.display = 'block';
  clearTimeout(r.bubbleTimer); r.bubbleTimer = setTimeout(() => { r.bubbleEl.style.display = 'none'; }, 6000);
}
function applyPlayersEvent(ev, d){
  if (d.path === '/') {
    const all = d.data || {};
    if (ev === 'put') Object.keys(remote).forEach(id => { if (!(id in all)) removeRemote(id); });
    Object.keys(all).forEach(id => setRemote(id, all[id]));
    ONLINE.announce = true;   // the first list is the people already here
    return;
  }
  const parts = d.path.split('/').filter(Boolean);
  if (parts.length === 1) { if (d.data === null) removeRemote(parts[0]); else setRemote(parts[0], d.data); }
}
function startStreams(){
  if (ONLINE.streamsOn) return;   // one connection, even after logging out and back in
  ONLINE.streamsOn = true;
  const ps = new EventSource(DB + '/adventure/players.json');
  ps.addEventListener('put', e => applyPlayersEvent('put', JSON.parse(e.data)));
  ps.addEventListener('patch', e => applyPlayersEvent('patch', JSON.parse(e.data)));
  const ns = new EventSource(DB + '/adventure/nodes.json');
  let nodesReady = false;   // the first snapshot is the state when we join, so it plays no effects
  const applyNodes = (ev, d) => {
    if (d.path === '/') ONLINE.nodes = d.data || {};
    else { const k = d.path.split('/').filter(Boolean)[0]; if (d.data === null) delete ONLINE.nodes[k]; else ONLINE.nodes[k] = d.data; }
    applyNodeStates(ONLINE.nodes, nodesReady);
    if (d.path === '/') nodesReady = true;
  };
  ns.addEventListener('put', e => applyNodes('put', JSON.parse(e.data)));
  ns.addEventListener('patch', e => applyNodes('patch', JSON.parse(e.data)));
  window.addEventListener('pagehide', () => {
    try { fetch(`${DB}/adventure/players/${ONLINE.id}.json`, { method: 'DELETE', keepalive: true }); } catch (e) {}
    saveNow(true);
  });
}
// once a frame: send our own position, save progress now and then, and move the others
function updateOnline(){
  if (!ONLINE.ready) return;
  writePresence(false);
  const now = Date.now();
  if (now - ONLINE.lastSave > 4000) { ONLINE.lastSave = now; saveNow(false); }
  const t = performance.now();
  for (const id in remote) {
    const r = remote[id];
    if (t - r.seen > 20000) { removeRemote(id); continue; }   // gone quiet: they have left
    const x = r.sprite.position.x, z = r.sprite.position.z;
    const nx = x + (r.tx - x) * 0.25, nz = z + (r.tz - z) * 0.25;
    const moving = Math.hypot(nx - x, nz - z) > 0.01;
    r.sprite.position.set(nx, 0, nz);
    if (moving) r.tick++;
    // what they are doing: the swing for chopping and mining, and a label for every action
    const act = r.act && t - r.actAt < ACT_TIME[r.act.k] ? r.act : null;
    const verb = act ? ACT_LABEL[act.k] : '';
    if (verb !== r.verb) { r.verb = verb; r.label.textContent = r.name + (verb ? ' (' + verb + ')' : ''); }
    let face = r.face;
    if (act && (act.k === 'chop' || act.k === 'mine')) {
      const node = nodeRecByKey(act.n);
      if (node) face = screenX(node.x, node.z) < screenX(nx, nz) ? -1 : 1;   // face the tree or rock
      const pose = swingPose(((t - r.actAt) / 750) % 1);
      const tex = r.swing[act.k === 'mine' ? 'pick' : 'axe'][SWING_POSES.indexOf(pose)];
      if (r.sprite.material.map !== tex) r.sprite.material.map = tex;
    } else {
      const f = moving ? Math.floor(r.tick / 6) % 4 : 0;
      if (r.sprite.material.map !== r.frames[f]) r.sprite.material.map = r.frames[f];
    }
    r.frames.forEach(tex => { tex.repeat.x = face; tex.offset.x = face < 0 ? 1 : 0; });   // face left or right
    r.swing.axe.concat(r.swing.pick).forEach(tex => { tex.repeat.x = face; tex.offset.x = face < 0 ? 1 : 0; });
    const v = new THREE.Vector3(nx, 4.4, nz).project(camera);
    const sx = (v.x + 1) / 2 * innerWidth, sy = (-v.y + 1) / 2 * innerHeight;
    r.label.style.left = sx + 'px'; r.label.style.top = sy + 'px'; r.label.style.display = 'block';
    const bv = new THREE.Vector3(nx, 4.9, nz).project(camera);   // snapped above the name tag
    r.bubbleEl.style.left = ((bv.x + 1) / 2 * innerWidth) + 'px'; r.bubbleEl.style.top = ((-bv.y + 1) / 2 * innerHeight) + 'px';
  }
}
// post-processing: a gentle glow on bright things like the fire and the sun
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());
// floating pollen and fireflies drifting around the player
const MOTES = 160;
const moteGeo = new THREE.BufferGeometry();
const moteBase = new Float32Array(MOTES * 3), motePos = new Float32Array(MOTES * 3);
for (let i = 0; i < MOTES; i++) { moteBase[i * 3] = (Math.random() - 0.5) * 50; moteBase[i * 3 + 1] = 0.5 + Math.random() * 6; moteBase[i * 3 + 2] = (Math.random() - 0.5) * 50; }
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const moteTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 32; const g = cv.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,250,210,1)'); gr.addColorStop(1, 'rgba(255,250,210,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(cv); })();
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({ map: moteTex, size: 0.35, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xfff2b0 }));
motes.frustumCulled = false; scene.add(motes);
function updateMotes(now){
  const t = now * 0.001;
  for (let i = 0; i < MOTES; i++) {
    const bx = moteBase[i * 3], bz = moteBase[i * 3 + 2];
    let x = bx + Math.sin(t * 0.3 + i) * 1.5, z = bz + Math.cos(t * 0.25 + i * 1.7) * 1.5;
    x = ((x - target.x + 25) % 50 + 50) % 50 - 25 + target.x; z = ((z - target.z + 25) % 50 + 50) % 50 - 25 + target.z;
    motePos[i * 3] = x; motePos[i * 3 + 1] = moteBase[i * 3 + 1] + Math.sin(t * 0.8 + i * 3.1) * 0.4; motePos[i * 3 + 2] = z;
  }
  moteGeo.attributes.position.needsUpdate = true;
}
function frame(){
  updateWalk();
  updateTrees();
  updateDebris();
  updateHouses();
  updateFish();
  updateOnline();
  updateWanderers();
  checkDialogDistance();
  fireMat.emissiveIntensity = 1.1 + 0.3 * Math.sin(performance.now() / 120);   // the fire flickers
  updateDoor();
  turnWithKeys();
  followCharacter();
  placeCamera();
  placeCreator();
  placeHeroChat();
  updateSun();
  const now = performance.now();
  riverTex.offset.x = now * 0.00004; riverTex.offset.y = Math.sin(now * 0.0007) * 0.05;
  clouds.rotation.y = now * 0.000006;
  sky.position.copy(camera.position);
  updateMotes(now);
  composer.render();
  requestAnimationFrame(frame);
}
const joinName = () => { const n = document.getElementById('nameInput').value.trim().slice(0, 12); if (n) enterVillage(n); };
document.getElementById('joinBtn').addEventListener('click', joinName);
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinName(); e.stopPropagation(); });
document.getElementById('retryBtn').addEventListener('click', bootOnline);
bootOnline();
frame();
</script>
