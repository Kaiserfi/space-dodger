const LEET = {'@':'A','$':'S','!':'I','|':'I','0':'O','3':'E','4':'A','5':'S','7':'T','8':'B'};
const _badCache = new Map();
function badName(name) {
  const key = String(name);
  if (_badCache.has(key)) return _badCache.get(key);
  const res = _badName(key); _badCache.set(key, res); return res;
}
function _badName(name) {
  const raw = String(name).toUpperCase();
  const leet = one => raw.replace(/[@$!|0134578]/g, c => c === '1' ? one : LEET[c]);   // catches $H1T, F4G, etc.
  for (const v of [leet('I'), leet('L'), raw]) {
    const compact = v.replace(/[^A-Z0-9]/g, '');                                 // catches F U C K, F.U.C.K
    if (BAD_SUB.some(w => compact.includes(w)) || BAD_WORD.has(compact)) return true;
    if (v.split(/[^A-Z0-9]+/).some(tok => tok && BAD_WORD.has(tok))) return true;
  }
  return false;
}

// ---------- FIT TO ANY SCREEN ----------
function fit() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth, vh = vv ? vv.height : window.innerHeight, pad = 10, border = 6;
  const k = Math.max(0.2, Math.min((vw - pad - border) / W, (vh - pad - border) / H, 1.6));   // keep 2:3 shape, up to 1.6x on big screens
  cv.style.width = Math.floor(W * k + border) + 'px'; cv.style.height = Math.floor(H * k + border) + 'px';
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
fit();

// ---------- INPUT ----------
addEventListener('keydown', e => {
  if (modalOpen) return;   // typing a name: don't treat keys as game controls
  keys[e.key] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (state === 'hub') { hubKey(e); return; }
  if (state.startsWith('snake')) { snakeKey(e); return; }
  if (state.startsWith('crawler')) { crawlerKey(e); return; }
  if (!e.repeat) {
    const k = e.key.toLowerCase();
    if (state === 'title' && k === 'escape') { state = 'hub'; return; }
    if (k === 'escape' || k === 'p') { if (state === 'play') { pauseGame(); return; } if (state === 'paused') { resumeGame(); return; } if (state === 'over' && k === 'escape') { goMenu(); return; } }
    if (k === 'q') { if (state === 'paused') { quitToMenu(); return; } if (state === 'over') { goMenu(); return; } }
  }
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && state !== 'play') activate();
  if (state === 'title' && !e.repeat) { if (e.key === 'n' || e.key === 'N') openName(null); if (e.key === 'l' || e.key === 'L') showBoard(); }
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
addEventListener('keyup', e => keys[e.key] = false);
function pos(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left - 3) * W / (r.width - 6); }
function posY(e){ const r = cv.getBoundingClientRect(); return (e.clientY - r.top - 3) * H / (r.height - 6); }
cv.addEventListener('pointerdown', e => {
  if (modalOpen) return;
  if (state === 'hub') { hubTap(pos(e), posY(e)); return; }
  if (state.startsWith('snake')) { snakeDown(e); return; }
  if (state.startsWith('crawler')) { crawlerDown(e); return; }
  if (state === 'play') {
    const px = pos(e), py = posY(e);
    if (py < 64 && Math.abs(px - W/2) < 36) { pauseGame(); return; }   // tap the pause button
    touchX = px; return;
  }
  if (state === 'paused') { const py = posY(e); if (py > 375 && py < 445) quitToMenu(); else resumeGame(); return; }
  const y = posY(e);
  if (state === 'title' && y < 60 && pos(e) < 130) { state = 'hub'; return; }   // < ARCADE
  if (state === 'over' && y > 668) { goMenu(); return; }                      // tap MAIN MENU
  if (state === 'title' && y > 622 && y < 655) { openName(null); return; }   // tap PLAYER line to change name
  if (state === 'title' && y > 690) { showBoard(); return; }                  // tap LEADERBOARD
  activate();
});
cv.addEventListener('pointermove', e => { if (touchX !== null) touchX = pos(e); if (crawlerPtr) crawlerPtr = {x: pos(e), y: posY(e)}; });
addEventListener('pointerup', () => touchX = null);
addEventListener('pointercancel', () => touchX = null);
addEventListener('pointerup', e => { if (state === 'snake') snakeUp(e); crawlerPtr = null; crawlerFire = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

let AC = null, master = null, muted = false, musicOn = false, nextNote = 0, step = 0, musicTimer = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
}
function tone(freq, start, dur, type='square', vol=0.15, slideTo=null) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, start);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
  g.gain.setValueAtTime(vol, start); g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  o.connect(g); g.connect(master); o.start(start); o.stop(start + dur + 0.02);
}
function noise(start, dur, vol=0.3) {
  if (!AC) return;
  const buf = AC.createBuffer(1, Math.max(1, AC.sampleRate * dur), AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(master); s.start(start);
}

  power()  { if (!AC) return; const n = AC.currentTime; [523,659,784,1047].forEach((f,i) => tone(f, n+i*0.06, 0.15, 'triangle', 0.2)); },
  life()   { if (!AC) return; const n = AC.currentTime; [392,523,659,784,1047,1319].forEach((f,i) => tone(f, n+i*0.07, 0.18, 'square', 0.1)); },
  stage()  { if (!AC) return; const n = AC.currentTime; [330,392,494,659].forEach((f,i) => tone(f, n+i*0.09, 0.2, 'square', 0.1)); },

function scheduleMusic() {
  if (!musicOn || !AC || !track) return;
  const tr = track, stepLen = 60 / tr.bpm() / 4;
  while (nextNote < AC.currentTime + 0.2) {
    const bar = Math.floor(step / 4) % 4, i = step % 16;
    if (tr.bass[i]) tone(tr.bass[i], nextNote, stepLen * 0.9, tr.bassWave, tr.bassVol);
    tone(tr.arp[bar][step % 3], nextNote, stepLen * 0.6, tr.arpWave, tr.arpVol);
    if (tr.tick && step % 4 === 0) noise(nextNote, 0.04, 0.12);
    if (tr.sparkle && i >= 12 && i % 2 === 0) tone(tr.arp[bar][2] * 2, nextNote, stepLen * 0.5, tr.arpWave, 0.05);

function startMusic() { playTrack('dodger'); }
function stopMusic() { musicOn = false; trackName = null; clearInterval(musicTimer); }
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }

// ---------- SETUP ----------
stars = Array.from({length:80}, () => ({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5}));

// pre-rendered CRT scanlines
const scan = document.createElement('canvas'); scan.width = W; scan.height = H;
(function(){ const s = scan.getContext('2d'); s.fillStyle = 'rgba(0,0,0,0.22)'; for (let y=0;y<H;y+=3) s.fillRect(0,y,W,1);
  const g = s.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.8); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  s.fillStyle = g; s.fillRect(0,0,W,H); })();

function pauseGame() {
  if (state !== 'play') return;
  state = 'paused'; touchX = null; for (const k in keys) keys[k] = false;
  if (AC && AC.state === 'running') AC.suspend();
}
function resumeGame() { if (state !== 'paused') return; state = 'play'; if (AC) AC.resume(); }
function quitToMenu() {      // leave a run from the pause menu; the score so far is still saved
  if (state !== 'paused') return;
  stopMusic(); if (AC) AC.resume();
  if (score > best) { best = score; try { localStorage.setItem('sdBest', best); } catch(e) {} }
  if (score > 0) loadBoard(true);
  state = 'hub';
}
function goMenu() { if (state === 'over' && Date.now() - overAt > 1200) state = 'hub'; }
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); snakePause(); crawlerPause(); } });   // auto-pause when you switch apps/tabs
addEventListener('blur', () => { pauseGame(); snakePause(); crawlerPause(); });

function activate() {
  if (state === 'paused') { resumeGame(); return; }
  if (state === 'board') { state = 'title'; return; }
  if (!canRestart()) return;
  if (!playerName) openName(start); else start();
}

const nameModal = document.getElementById('nameModal'), nameInput = document.getElementById('nameInput'), nameErr = document.getElementById('nameErr');
nameInput.addEventListener('input', () => nameErr.textContent = '');
let afterName = null;
function openName(cb) {
  afterName = cb; modalOpen = true; touchX = null; for (const k in keys) keys[k] = false;
  nameErr.textContent = ''; nameInput.value = playerName; nameModal.hidden = false; setTimeout(() => { nameInput.focus(); nameInput.select(); }, 30);
}
function submitName() {
  const n = nameInput.value.replace(/[^A-Za-z0-9 _-]/g, '').trim().toUpperCase().slice(0, 12);
  if (!n) { nameErr.textContent = 'Please type your name first!'; nameInput.focus(); return; }   // no silent default name
  if (badName(n)) { nameErr.textContent = "That name isn't allowed. Please pick a different one!"; nameInput.focus(); return; }
  playerName = n; try { localStorage.setItem('sdName', n); } catch(e) {}
  nameModal.hidden = true; modalOpen = false; nameInput.blur();
  const cb = afterName; afterName = null; if (cb) setTimeout(cb, 0);
}
document.getElementById('nameOk').addEventListener('click', submitName);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitName(); }
  if (e.key === 'Escape' && playerName) { nameModal.hidden = true; modalOpen = false; afterName = null; } });

// --- leaderboard storage: local (always) + online (if LEADERBOARD_URL is set); each game has its own board ---
function localBoard(G) { try { return JSON.parse(localStorage.getItem(G.local) || '[]'); } catch(e) { return []; } }
function saveLocal(name, sc, G) {
  const list = localBoard(G), k = nameKey(name), me = list.find(r => nameKey(r.name) === k);
  if (me) { if (sc > me.score) me.score = sc; } else list.push({name, score: sc});
  list.sort((a, b) => b.score - a.score);
  try { localStorage.setItem(G.local, JSON.stringify(list.slice(0, 25))); } catch(e) {}
  return list.slice(0, 25);
}
async function fetchGlobal(G) {
  const res = await fetch(LEADERBOARD_URL.replace(/\/$/, '') + '/' + G.path + '.json?orderBy="score"&limitToLast=25', {cache: 'no-store'});
  if (!res.ok) throw new Error('bad response');
  const data = (await res.json()) || {};
  return Object.values(data).filter(r => r && typeof r.score === 'number').sort((a, b) => b.score - a.score).slice(0, 25);
}
async function submitGlobal(name, sc, G) {
  const key = nameKey(name), pbKey = G.pb + key; let pb = 0;
  try { pb = +(localStorage.getItem(pbKey) || 0); } catch(e) {}
  if (sc <= pb) return;     // only post a new personal best
  const res = await fetch(LEADERBOARD_URL.replace(/\/$/, '') + '/' + G.path + '/' + key + '.json', {method: 'PUT', body: JSON.stringify({name, score: sc, ts: Date.now()})});
  if (res.ok) { try { localStorage.setItem(pbKey, sc); } catch(e) {} }
}
async function loadBoard(submit, G = DG) {
  boardStatus = 'loading';
  const sc = G.score();
  const local = submit ? saveLocal(playerName, sc, G) : localBoard(G);
  if (!LEADERBOARD_URL) { board = local; boardIsGlobal = false; boardStatus = 'ok'; return; }
  try {
    if (submit) await submitGlobal(playerName, sc, G);
    board = await fetchGlobal(G); boardIsGlobal = true; boardStatus = 'ok';
  } catch(e) { board = local; boardIsGlobal = false; boardStatus = 'offline'; }
}
function showBoard(G = DG) { state = 'board'; loadBoard(false, G); }

function start() {
  startMusic();
  state = 'play'; score = 0; t = 0; spawnTimer = 30; nextLife = LIFE_EVERY; lifeCount = 0; banner2 = 0; shake = 0; stage = 1; banner = 120; combo = 0; comboTimer = 0;
  ship = {x:W/2, y:H-90, shield:0, boost:0, rapid:0, cd:0, lives:3, inv:90, twin:false, wing:0};
  rocks = []; orbs = []; bullets = []; parts = []; floaters = []; rings = [];
  sfx.stage();
}

function boom(x, y, color, n=24) {
  for (let i=0;i<n;i++) { const a=Math.random()*6.28, s=Math.random()*5+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*30,color}); }
}
function floater(x, y, text, color='#fff') { floaters.push({x,y,text,color,life:50}); }
function addScore(n, x, y) { score += n; floater(x, y, '+' + n + (combo > 1 ? ' x' + combo : ''), combo > 1 ? '#ff0' : '#fff'); }

function makeRock(x, y, r, vy, vx) {
  return {x, y, r, vy, vx, rot:0, vr:(Math.random()-0.5)*0.1, hp: r > 34 ? 3 : r > 22 ? 2 : 1, hitFlash:0, seed:Math.random()*10};
}

function pickOrb() {
  const bag = ['shield','turbo','rapid','rapid','twin'];
  return bag[Math.floor(Math.random()*bag.length)];
}

function killRock(r) {
  r.dead = true;
  combo = comboTimer > 0 ? Math.min(5, combo + 1) : 1; comboTimer = 150;
  addScore(Math.round(r.r) * 2 * combo, r.x, r.y);
  boom(r.x, r.y, '#fa6', 14 + Math.round(r.r / 2)); sfx.pop(); shake = Math.max(shake, 4);
  rings.push({x:r.x, y:r.y, r:r.r, life:22});
  // bigger rocks have a better chance to drop a power-up (~4% small ... ~8% big)
  if (Math.random() < 0.025 + r.r * 0.0015) { const typ = pickOrb(); orbs.push({x:r.x, y:r.y, type:typ, drop:true}); floater(r.x, r.y - 22, 'DROP!', ORB[typ].color); }
  for (let i = 0; i < 5 + Math.round(r.r / 8); i++) {       // tumbling rock chunks that fade away
    const a = Math.random()*6.28, sp = 1 + Math.random()*4;
    parts.push({x:r.x, y:r.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:35+Math.random()*30, color:'#a89684', chunk:true, rot:Math.random()*6, vr:(Math.random()-0.5)*0.5, size:3+Math.random()*r.r*0.25});
  }
  if (r.r >= 24) for (const d of [-1, 1]) rocks.push(makeRock(r.x + d*8, r.y, r.r*0.6, r.vy + 0.5, d*(1 + Math.random())));
}

function update() {
  if (state === 'paused') return;
  stars.forEach(s => { s.y += s.s * (state==='play' ? 1 + stage*0.3 : 0.6); if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; if (p.chunk) { p.rot += p.vr; p.vx *= 0.98; p.vy *= 0.98; } });
  rings.forEach(g => g.life--); rings = rings.filter(g => g.life > 0);
  parts = parts.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 0.8; f.life--; }); floaters = floaters.filter(f => f.life > 0);
  if (shake > 0) shake--; if (flash > 0) flash--;
  if (state !== 'play') { rocks.forEach(r => { r.y += r.vy*0.5; r.rot += r.vr; }); return; }

  t++;
  const speed = ship.boost > 0 ? 8 : 5.5;
  if (keys.ArrowLeft || keys.a || keys.A) ship.x -= speed;
  if (keys.ArrowRight || keys.d || keys.D) ship.x += speed;
  if (touchX !== null) ship.x += Math.max(-speed*1.5, Math.min(speed*1.5, touchX - ship.x));
  if (ship.twin && ship.wing < 34) ship.wing += 2;   // second ship slides out beside you
  ship.x = Math.max(20, Math.min(W-20-ship.wing, ship.x));
  ['shield','boost','rapid','inv'].forEach(k => { if (ship[k] > 0) ship[k]--; });
  if (comboTimer > 0 && --comboTimer === 0) combo = 0;
  if (banner > 0) banner--;

  // shooting: automatic
  if (ship.cd > 0) ship.cd--;
  if (ship.cd === 0) {   // auto-fire: the ship shoots constantly, you just steer!
    ship.cd = ship.rapid > 0 ? 6 : 14; sfx.pew();
    for (const gx of ship.twin ? [ship.x, ship.x + ship.wing] : [ship.x]) {   // both ships fire
      if (ship.rapid > 0) bullets.push({x:gx-9,y:ship.y-14},{x:gx+9,y:ship.y-14});
      else bullets.push({x:gx, y:ship.y-22});
    }
  }
  bullets.forEach(b => b.y -= 11);
  bullets = bullets.filter(b => b.y > -20 && !b.dead);

  // stage / difficulty
  const newStage = 1 + Math.floor(t / 1200);
  if (newStage !== stage) { stage = newStage; banner = 120; sfx.stage(); score += 100; }
  const level = 1 + t / 650;
  if (--spawnTimer <= 0) {
    const r = 14 + Math.random()*26;
    const rx = Math.random()*(W-2*r)+r, rvy = (1.6+Math.random()*1.8)*Math.min(level,3.6);
    let rvx = (Math.random()-0.5)*1.5;
    // from stage 2, some rocks are aimed at where you are right now
    if (stage >= 2 && Math.random() < Math.min(0.4, 0.12 + stage*0.06)) rvx = Math.max(-4, Math.min(4, (ship.x - rx) / ((ship.y + r) / rvy)));
    rocks.push(makeRock(rx, -r, r, rvy, rvx));
    spawnTimer = Math.max(10, 46 - level*6);
  }

  rocks.forEach(r => { r.y += r.vy; r.x += r.vx; r.rot += r.vr; if (r.hitFlash>0) r.hitFlash--; if (r.x<r.r||r.x>W-r.r) r.vx*=-1; });
  orbs.forEach(o => o.y += 2.5);

  // bullets vs rocks
  for (const b of bullets) for (const r of rocks) {
    if (!r.dead && !b.dead && Math.hypot(r.x-b.x, r.y-b.y) < r.r + 4) {
      b.dead = true; r.hp--; r.hitFlash = 4; boom(b.x, b.y, '#ff8', 3);
      if (r.hp <= 0) killRock(r); else sfx.hit();
    }
  }
  // rocks vs ship
  for (const r of rocks) {
    if (r.dead || ship.inv > 0) continue;
    const wx = ship.x + ship.wing;
    if (ship.twin && ship.wing > 14 && Math.hypot(r.x-wx, r.y-ship.y) < r.r + 12) {
      if (ship.shield > 0) { killRock(r); continue; }
      // the second ship takes the hit: it is destroyed, but NO life is lost
      r.dead = true; boom(wx, ship.y, '#c8f', 45); boom(r.x, r.y, '#f66', 14);
      rings.push({x:wx, y:ship.y, r:20, life:22}); ship.twin = false; ship.wing = 0; ship.inv = Math.max(ship.inv, 45);
      shake = Math.max(shake, 10); sfx.ouch(); floater(wx, ship.y - 30, 'WINGMAN LOST!', '#c8f');
      continue;
    }
    if (Math.hypot(r.x-ship.x, r.y-ship.y) > r.r + 12) continue;
    if (ship.shield > 0) { killRock(r); continue; }
    r.dead = true; boom(r.x, r.y, '#f66', 20); boom(ship.x, ship.y, '#f66', 40);
    ship.lives--; combo = 0; comboTimer = 0; shake = 18; flash = 8;
    if (ship.lives <= 0) { gameOver(); return; }
    ship.inv = 100; sfx.ouch();
  }
  // orbs
  for (const o of orbs) {
    if (Math.hypot(o.x-ship.x, o.y-ship.y) < 26 || (ship.twin && ship.wing > 14 && Math.hypot(o.x-(ship.x+ship.wing), o.y-ship.y) < 26)) {
      o.dead = true; const c = ORB[o.type].color; boom(o.x, o.y, c, 30);
      if (o.type==='shield') { ship.shield = 420; sfx.power(); }
      else if (o.type==='turbo') { ship.boost = 420; sfx.power(); }
      else if (o.type==='rapid') { ship.rapid = 480; sfx.power(); }
      else if (o.type==='twin') { if (ship.twin) addScore(250, o.x, o.y); else { ship.twin = true; ship.wing = 0; } sfx.life(); }
      addScore(50, o.x, o.y); floater(o.x, o.y - 18, ORB[o.type].label, c);
    }
  }
  rocks = rocks.filter(r => !r.dead && r.y < H+60);
  orbs = orbs.filter(o => !o.dead && o.y < H+30);
  if (t % 10 === 0) score++;
  if (score >= nextLife) {   // extra life every LIFE_EVERY points
    lifeCount++; nextLife += LIFE_EVERY * (1 + lifeCount);   // 3000, then 6000 more, then 9000 more...
    if (ship.lives < 5) { ship.lives++; sfx.life(); floater(ship.x, ship.y - 40, '1UP! EXTRA LIFE', '#6f6'); banner2 = 90; }
  }
}

const ORB = { shield:{color:'#5ef', letter:'S', label:'SHIELD!'}, turbo:{color:'#fd3', letter:'T', label:'TURBO!'},
              rapid:{color:'#f55', letter:'R', label:'RAPID FIRE!'}, twin:{color:'#c8f', letter:'D', label:'DUAL FIGHTER!'}, life:{color:'#6f6', letter:'♥', label:'1UP!'} };

function gameOver() {
  state = 'over'; overAt = Date.now(); touchX = null; boom(ship.x, ship.y, '#f66', 70); shake = 24;
  stopMusic(); sfx.crash(); loadBoard(true);
  if (score > best) { best = score; try { localStorage.setItem('sdBest', best); } catch(e){} }
}

// ---------- DRAWING ----------
function glowText(text, x, y, size, color, align='center', glow=12) {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.shadowBlur = 0;
}
const pad = n => String(n).padStart(6, '0');

function drawShip(x, y, s=1, accent='#ff3df0') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = ship && ship.boost>0 ? '#fd3' : '#f84';
  ctx.beginPath(); ctx.moveTo(-8,16); ctx.lineTo(0,28+Math.random()*10); ctx.lineTo(8,16); ctx.fill();
  ctx.shadowColor = '#5ef'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#e8f0ff'; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(16,18); ctx.lineTo(0,10); ctx.lineTo(-16,18); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(0,-2,5,0,6.28); ctx.fill();
  ctx.restore();
}

// ---------- SNAKE ----------
const SN = { COLS: 20, ROWS: 24, CELL: 24, OX: 0, OY: 96 };   // grid and where it sits on the canvas
const DG = { path: 'scores', local: 'sdBoard', pb: 'sdPB_', score: () => score };          // Space Dodger's board
const SG = { path: 'snake', local: 'sdBoardSnake', pb: 'sdPBsnake_', score: () => (snake ? snake.score : 0) };  // Snake's own board
let snake = null, snakeBest = 0, snakeOverAt = 0, snakeTouch = null;
try { snakeBest = +(localStorage.getItem('sdSnakeBest') || 0); } catch(e) {}
const DIRS4 = [[1,0],[-1,0],[0,1],[0,-1]];
const cellKey = (x, y) => x + ',' + y;

// speed: a move every N frames. Gets faster as you grow and with each stage.
function snakeStepFrames(s) { return Math.max(6, 12 - Math.floor(s.body.length / 3) - (s.stage - 1)); }

function startSnake() {
  playTrack('snake');
  const cx = Math.floor(SN.COLS / 2), cy = Math.floor(SN.ROWS / 2);
  snake = { body: [{x: cx, y: cy}, {x: cx-1, y: cy}, {x: cx-2, y: cy}, {x: cx-3, y: cy}, {x: cx-4, y: cy}],
            dir: {x: 1, y: 0}, queue: [], timer: 0, grow: 0, score: 0, stage: 1, eaten: 0,
            walls: [], foods: [], countdown: 180, banner: 120, reason: '' };
  snakeSpawnFood('orb');
  state = 'snake'; touchX = null; snakeTouch = null;
  sfx.stage();
}

// every cell the head can reach without crossing a wall or body (used so food and walls never trap you)
function snakeOpen(s) {
  const blocked = new Set();
  s.body.forEach(p => blocked.add(cellKey(p.x, p.y)));
  s.walls.forEach(p => blocked.add(cellKey(p.x, p.y)));
  const h = s.body[0], seen = new Set([cellKey(h.x, h.y)]), q = [h];
  while (q.length) {
    const c = q.pop();
    for (const [dx, dy] of DIRS4) {
      const x = c.x + dx, y = c.y + dy, k = cellKey(x, y);
      if (x < 0 || y < 0 || x >= SN.COLS || y >= SN.ROWS || seen.has(k) || blocked.has(k)) continue;
      seen.add(k); q.push({x, y});
    }
  }
  return seen;
}
const cellsOf = set => [...set].map(k => { const [x, y] = k.split(',').map(Number); return {x, y}; });

function snakeSpawnFood(type) {
  const s = snake, h = s.body[0], taken = new Set(s.foods.map(f => cellKey(f.x, f.y)));
  let cells = cellsOf(snakeOpen(s)).filter(c => !taken.has(cellKey(c.x, c.y)) && !(c.x === h.x && c.y === h.y));
  if (type !== 'orb') cells = cells.filter(c => Math.abs(c.x - h.x) + Math.abs(c.y - h.y) >= 4);   // no surprise food next to your head
  if (!cells.length) return;
  const c = cells[Math.floor(Math.random() * cells.length)];
  const f = {x: c.x, y: c.y, type};
  if (type === 'gold') f.ttl = 420;     // gold orbs vanish after 7 seconds
  s.foods.push(f);
}

// new stage: add blocks, but never cut the board in two or trap food
function snakeAddWalls(s, n) {
  for (let i = 0; i < n; i++) {
    const before = snakeOpen(s).size, h = s.body[0];
    const cand = cellsOf(snakeOpen(s)).filter(c => Math.abs(c.x - h.x) + Math.abs(c.y - h.y) >= 5 && !s.foods.some(f => f.x === c.x && f.y === c.y));
    if (!cand.length) return;
    const c = cand[Math.floor(Math.random() * cand.length)];
    s.walls.push({x: c.x, y: c.y});
    const after = snakeOpen(s);
    const foodOk = s.foods.every(f => after.has(cellKey(f.x, f.y)));
    if (after.size < before - 1 || !foodOk) s.walls.pop();   // a new block removes exactly one open cell; anything more means a cut-off
  }
}

function snakeTurn(dx, dy) {
  const s = snake; if (!s) return;
  const last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
  if (dx === last.x && dy === last.y) return;     // already going that way
  if (dx === -last.x && dy === -last.y) return;   // no instant reverse into your own body
  if (s.queue.length < 2) s.queue.push({x: dx, y: dy});
}
function snakeTurnSide(side) {                    // -1 = turn left, 1 = turn right, relative to where you're heading
  const s = snake, d = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
  if (side < 0) snakeTurn(d.y, -d.x); else snakeTurn(-d.y, d.x);
}

function snakeStep() {
  const s = snake;
  if (s.queue.length) s.dir = s.queue.shift();
  const h = s.body[0], nx = h.x + s.dir.x, ny = h.y + s.dir.y;
  if (nx < 0 || ny < 0 || nx >= SN.COLS || ny >= SN.ROWS) return snakeDie('HIT A WALL');
  if (s.walls.some(w => w.x === nx && w.y === ny)) return snakeDie('HIT A BLOCK');
  const hit = s.body.findIndex(p => p.x === nx && p.y === ny);
  if (hit >= 0 && (hit < s.body.length - 1 || s.grow > 0)) return snakeDie('BIT YOUR TAIL');   // the tail moves away, so stepping into it is fine
  s.body.unshift({x: nx, y: ny});
  if (s.grow > 0) s.grow--; else s.body.pop();
  const fi = s.foods.findIndex(f => f.x === nx && f.y === ny);
  if (fi >= 0) snakeEat(s.foods[fi], fi);
}

function snakeEat(f, i) {
  const s = snake, C = SN.CELL, px = SN.OX + f.x*C + C/2, py = SN.OY + f.y*C + C/2;
  s.foods.splice(i, 1);
  if (f.type === 'poison') {
    s.body.splice(-2, 2);                                   // lose two tail segments
    boom(px, py, '#c5f', 24); sfx.ouch(); floater(px, py - 14, '-2 SHORTER!', '#c5f');
    if (s.body.length < 3) return snakeDie('TOO SHORT');
  } else if (f.type === 'gold') {
    s.grow += 2; s.score += 50; boom(px, py, '#fd3', 30); sfx.power(); floater(px, py - 14, '+50 GOLD!', '#fd3');
  } else {
    const pts = 10 + 5 * (s.stage - 1);
    s.grow += 1; s.score += pts; s.eaten++;
    boom(px, py, '#5f5', 12); sfx.pop(); floater(px, py - 14, '+' + pts, '#5f5');
    if (s.eaten % 6 === 0) { s.stage++; s.banner = 120; snakeAddWalls(s, 2); sfx.stage(); }
  }
  if (!s.foods.some(q => q.type === 'orb')) snakeSpawnFood('orb');
  if (f.type !== 'poison') {
    if (s.body.length >= 6 && Math.random() < 0.35 && s.foods.filter(q => q.type === 'poison').length < Math.min(3, s.stage)) snakeSpawnFood('poison');
    if (Math.random() < 0.12 && !s.foods.some(q => q.type === 'gold')) snakeSpawnFood('gold');
  }
}

function snakeSaveBest() {
  if (snake && snake.score > snakeBest) { snakeBest = snake.score; try { localStorage.setItem('sdSnakeBest', snakeBest); } catch(e) {} }
}
function snakeDie(reason) {
  const s = snake, C = SN.CELL, h = s.body[0];
  s.reason = reason; state = 'snakeOver'; snakeOverAt = Date.now();
  boom(SN.OX + h.x*C + C/2, SN.OY + h.y*C + C/2, '#7f7', 50); shake = 20;
  stopMusic(); sfx.crash(); snakeSaveBest(); loadBoard(true, SG);
}

function snakeUpdate() {
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; }); parts = parts.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 0.8; f.life--; }); floaters = floaters.filter(f => f.life > 0);
  if (shake > 0) shake--;
  const s = snake;
  if (!s || state !== 'snake') return;               // paused or game over: nothing moves
  if (s.countdown > 0) { s.countdown--; return; }
  if (s.banner > 0) s.banner--;
  s.timer++;
  if (s.timer >= snakeStepFrames(s)) { s.timer = 0; snakeStep(); }
  if (state === 'snake') {
    for (const f of s.foods) if (f.type === 'gold') f.ttl--;
    s.foods = s.foods.filter(f => f.type !== 'gold' || f.ttl > 0);
    if (!s.foods.some(f => f.type === 'orb')) snakeSpawnFood('orb');
  }
}

function snakeKey(e) {
  const k = e.key.toLowerCase();
  if (state === 'snake') {
    if (k === 'arrowup' || k === 'w') snakeTurn(0, -1);
    else if (k === 'arrowdown' || k === 's') snakeTurn(0, 1);
    else if (k === 'arrowleft' || k === 'a') snakeTurn(-1, 0);
    else if (k === 'arrowright' || k === 'd') snakeTurn(1, 0);
    else if ((k === 'escape' || k === 'p') && !e.repeat) snakePause();
    return;
  }
  if (e.repeat) return;
  if (state === 'snakePaused') {
    if (k === 'escape' || k === 'p' || k === ' ' || k === 'enter') snakeResume();
    else if (k === 'q') snakeQuit();
  } else if (state === 'snakeOver') {
    if (k === 'escape' || k === 'q') snakeQuit();
    else if ((k === ' ' || k === 'enter') && Date.now() - snakeOverAt > 1200) startSnake();
  }
}
function snakeDown(e) {
  const x = pos(e), y = posY(e);
  if (state === 'snake') {
    if (y < 64 && Math.abs(x - W/2) < 36) { snakePause(); return; }   // pause button
    snakeTouch = {x, y}; return;
  }
  if (state === 'snakePaused') { if (y > 375 && y < 445) snakeQuit(); else snakeResume(); return; }
  if (state === 'snakeOver') {
    if (y > 668) snakeQuit();
    else if (Date.now() - snakeOverAt > 1200) startSnake();
  }
}
function snakeUp(e) {               // a swipe turns that way; a tap turns left on the left half, right on the right
  const t0 = snakeTouch; snakeTouch = null;
  if (!t0 || state !== 'snake') return;
  const dx = pos(e) - t0.x, dy = posY(e) - t0.y;
  if (Math.abs(dx) + Math.abs(dy) >= 24) { if (Math.abs(dx) > Math.abs(dy)) snakeTurn(Math.sign(dx), 0); else snakeTurn(0, Math.sign(dy)); }
  else snakeTurnSide(t0.x < W/2 ? -1 : 1);
}
function snakePause() { if (state !== 'snake') return; state = 'snakePaused'; if (AC && AC.state === 'running') AC.suspend(); }
function snakeResume() { if (state !== 'snakePaused') return; state = 'snake'; if (AC) AC.resume(); }
function snakeQuit() {                // leave to the arcade menu; a run you quit from pause still posts its score
  if (state === 'snakePaused' && snake && snake.score > 0) { snakeSaveBest(); loadBoard(true, SG); }
  stopMusic(); if (AC) AC.resume();
  state = 'hub';
}

function drawSnakeArt(x, y, w, h) {
  const c = 22, ox = x + (w - 8*c)/2, oy = y + (h - 6*c)/2;
  ctx.strokeStyle = 'rgba(80,255,120,0.18)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(ox + i*c, oy); ctx.lineTo(ox + i*c, oy + 6*c); ctx.stroke(); }
  for (let j = 0; j <= 6; j++) { ctx.beginPath(); ctx.moveTo(ox, oy + j*c); ctx.lineTo(ox + 8*c, oy + j*c); ctx.stroke(); }
  const body = [[1,4],[2,4],[3,4],[3,3],[3,2],[4,2],[5,2],[5,3],[5,4]];
  body.forEach(([cx, cy], i) => {
    const t = i / (body.length - 1);
    ctx.fillStyle = i === body.length - 1 ? '#dfffc0' : `rgb(${Math.round(60 - 30*t)}, ${Math.round(220 - 120*t)}, ${Math.round(110 - 60*t)})`;
    ctx.fillRect(ox + cx*c + 2, oy + cy*c + 2, c - 4, c - 4);
  });
  ctx.fillStyle = '#fd3'; ctx.shadowColor = '#fd3'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(ox + 7*c + c/2, oy + c + c/2, 7, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
}

function drawSnakeFrame() {
  const s = snake;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.fillStyle = '#031209'; ctx.fillRect(-30, -30, W + 60, H + 60);
  if (s) drawSnakeBoard(s);
  parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.life/30); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
  ctx.globalAlpha = 1;
  floaters.forEach(f => { ctx.globalAlpha = Math.min(1, f.life/20); glowText(f.text, f.x, f.y, 16, f.color, 'center', 6); });
  ctx.globalAlpha = 1;
  if (s) drawSnakeHUD(s);
  if (state === 'snakePaused') drawPaused();
  else if (state === 'snakeOver') drawSnakeOver(s);
  ctx.restore();
  ctx.drawImage(scan, 0, 0);
}

function drawSnakeBoard(s) {
  const C = SN.CELL, bx = SN.OX, by = SN.OY, bw = SN.COLS*C, bh = SN.ROWS*C;
  ctx.fillStyle = 'rgba(0,30,15,0.85)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = 'rgba(80,255,120,0.08)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i <= SN.COLS; i++) { ctx.moveTo(bx + i*C + 0.5, by); ctx.lineTo(bx + i*C + 0.5, by + bh); }
  for (let j = 0; j <= SN.ROWS; j++) { ctx.moveTo(bx, by + j*C + 0.5); ctx.lineTo(bx + bw, by + j*C + 0.5); }
  ctx.stroke();
  ctx.strokeStyle = '#5f5'; ctx.lineWidth = 4; ctx.shadowColor = '#5f5'; ctx.shadowBlur = 14; ctx.strokeRect(bx + 2, by + 2, bw - 4, bh - 4); ctx.shadowBlur = 0;
  // blocks
  ctx.fillStyle = '#6b2a2a'; ctx.strokeStyle = '#f66'; ctx.lineWidth = 2;
  for (const w of s.walls) { const px = bx + w.x*C, py = by + w.y*C; ctx.fillRect(px + 2, py + 2, C - 4, C - 4); ctx.strokeRect(px + 3, py + 3, C - 6, C - 6); }
  // food
  for (const f of s.foods) {
    const cx = bx + f.x*C + C/2, cy = by + f.y*C + C/2;
    if (f.type === 'orb') { ctx.fillStyle = '#5f5'; ctx.shadowColor = '#5f5'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, 6.28); ctx.fill(); }
    else if (f.type === 'gold') {
      const hidden = f.ttl < 120 && Math.floor(f.ttl / 6) % 2;   // flashes as it runs out
      if (!hidden) { ctx.fillStyle = '#fd3'; ctx.shadowColor = '#fd3'; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 6.28); ctx.fill(); }
    } else {
      ctx.fillStyle = '#c5f'; ctx.shadowColor = '#c5f'; ctx.shadowBlur = 10; ctx.fillRect(cx - 7, cy - 7, 14, 14);
      ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = `bold 12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('X', cx, cy + 4);
    }
    ctx.shadowBlur = 0;
  }
  // snake: bright head, body fades toward the tail; flashes red when you die
  const n = s.body.length, flash = state === 'snakeOver' && Math.floor(Date.now() / 100) % 2;
  s.body.forEach((p, i) => {
    const t = i / Math.max(1, n - 1);
    let col = i === 0 ? '#dfffc0' : `rgb(${Math.round(60 - 30*t)}, ${Math.round(220 - 120*t)}, ${Math.round(110 - 60*t)})`;
    if (flash) col = '#f66';
    ctx.fillStyle = col; ctx.fillRect(bx + p.x*C + 2, by + p.y*C + 2, C - 4, C - 4);
  });
  const h = s.body[0], d = s.dir, hx = bx + h.x*C + C/2, hy = by + h.y*C + C/2;
  ctx.fillStyle = '#012';
  for (const sg of [-1, 1]) ctx.fillRect(hx + d.x*4 - d.y*5*sg - 2, hy + d.y*4 + d.x*5*sg - 2, 4, 4);
  if (state === 'snake' && s.countdown > 0) glowText(String(Math.ceil(s.countdown / 60)), W/2, 400, 120, '#fd3', 'center', 30);
}

function drawSnakeHUD(s) {
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 18, 12, 36, 32);
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(W/2 - 8, 19, 5, 18); ctx.fillRect(W/2 + 3, 19, 5, 18);
  glowText(pad(s.score), 16, 46, 22, '#fff', 'left', 4);
  glowText('HI-SCORE', W - 16, 24, 14, '#5f5', 'right');
  glowText(pad(Math.max(snakeBest, s.score)), W - 16, 46, 22, '#fff', 'right', 4);
  glowText('STAGE ' + s.stage + '   LEN ' + s.body.length, W/2, 84, 14, '#fd3', 'center', 0);
  if (s.banner > 0 && state === 'snake') glowText('STAGE ' + s.stage, W/2, 330, 46, '#5f5', 'center', 18);
}

function drawSnakeOver(s) {
  ctx.fillStyle = 'rgba(0,10,5,0.72)'; ctx.fillRect(0, 130, W, 560);
  glowText('GAME OVER', W/2, 200, 54, '#f44', 'center', 22);
  glowText(s.reason, W/2, 240, 16, '#f88', 'center', 4);
  glowText(playerName + '  ' + pad(s.score), W/2, 280, 24, '#fff', 'center', 6);
  glowText(s.score >= snakeBest && s.score > 0 ? '★ NEW HIGH SCORE! ★' : 'HI-SCORE ' + pad(snakeBest), W/2, 312, 17, '#fd3', 'center', 8);
  glowText('- TOP PILOTS -', W/2, 355, 18, '#5f5', 'center', 8);
  drawRows(8, 388, 25, 18);
  if (Date.now() - snakeOverAt > 1200) {
    glowText('TRY AGAIN?', W/2, 610, 34, '#fff', 'center', 14);
    if (Math.floor(Date.now()/500) % 2) glowText('PRESS SPACE OR TAP', W/2, 642, 17, '#5f5', 'center', 8);
  }
  glowText('ARCADE MENU  (ESC or tap here)', W/2, 698, 15, '#5f5', 'center', 6);
}

// ---------- CRAWLER (original shooter: a centipede winds through a mushroom field) ----------
const CR = { COLS: 20, ROWS: 25, CELL: 24, OX: 0, OY: 96, ZONE: 19 };   // ZONE: rows from here down are your zone
const CG = { path: 'crawler', local: 'sdBoardCrawler', pb: 'sdPBcrawler_', score: () => (crawler ? crawler.score : 0) };
let crawler = null, crawlerBest = 0, crawlerOverAt = 0, crawlerPtr = null, crawlerFire = false;
const CR_FIRE = {x: 418, y: 642, r: 36};   // on-screen FIRE button for phones
try { crawlerBest = +(localStorage.getItem('sdCrawlerBest') || 0); } catch(e) {}
const crPX = x => CR.OX + x*CR.CELL + CR.CELL/2, crPY = y => CR.OY + y*CR.CELL + CR.CELL/2;
const crZoneTop = () => CR.OY + CR.ZONE*CR.CELL, crZoneBottom = () => CR.OY + CR.ROWS*CR.CELL;

const crSfx = {
  fire()  { if (!AC) return; const n = AC.currentTime; tone(900, n, 0.05, 'square', 0.04, 500); },
  step(i) { if (!AC) return; const n = AC.currentTime; tone(i % 2 ? 130 : 98, n, 0.05, 'triangle', 0.07); },
  split() { if (!AC) return; const n = AC.currentTime; tone(600, n, 0.06, 'square', 0.08, 900); tone(900, n + 0.05, 0.06, 'square', 0.08, 1300); },
  hit()   { if (!AC) return; const n = AC.currentTime; tone(300, n, 0.04, 'square', 0.05); },
  flea()  { if (!AC) return; const n = AC.currentTime; tone(1400, n, 0.12, 'square', 0.05, 900); },
  spider(){ if (!AC) return; const n = AC.currentTime; tone(160, n, 0.3, 'sawtooth', 0.06, 260); },
  wave()  { if (!AC) return; const n = AC.currentTime; [262, 330, 392, 523, 659].forEach((f, i) => tone(f, n + i*0.08, 0.14, 'square', 0.08)); },
  die()   { if (!AC) return; const n = AC.currentTime; noise(n, 0.7, 0.4); tone(300, n, 0.7, 'sawtooth', 0.15, 40); },
};

function crawlerAddMushroom(c) {
  for (let t = 0; t < 40; t++) {
    const x = Math.floor(Math.random() * CR.COLS), y = 1 + Math.floor(Math.random() * (CR.ZONE - 3));
    if (!c.mush.has(crKey(x, y))) { c.mush.set(crKey(x, y), 4); return; }
  }
}
function crawlerSpawnCentipede(c) {
  const len = Math.min(16, 8 + 2 * (c.wave - 1));
  const segs = [];
  for (let i = 0; i < len; i++) segs.push({x: len - 1 - i, y: 0});   // head on the right, moving right
  c.chains = [{segs, dir: 1}];
  c.countdown = 120; c.banner = 120; c.timer = 0;
  for (let i = 0; i < 5; i++) crawlerAddMushroom(c);
}
function crKey(x, y) { return x + ',' + y; }
// the colours of each wave, cycling like the original: mushroom caps (by damage), centipede head and body
const CRAWLER_PALETTES = [
  { caps: {4: '#2ef2c8', 3: '#24b89c', 2: '#1a7f6c', 1: '#125a4e'}, head: '#ff4d4d', body: ['#9f3', '#6c2'] },   // green
  { caps: {4: '#ffb347', 3: '#e08a2e', 2: '#a85c1a', 1: '#6b3a10'}, head: '#fff', body: ['#ffd24a', '#ffa31a'] },  // orange
  { caps: {4: '#ff6fd8', 3: '#d64fb0', 2: '#9a2f7e', 1: '#5e1c4d'}, head: '#ffe14d', body: ['#6ef3ff', '#2bb7d6'] }, // pink
  { caps: {4: '#c9a7ff', 3: '#9a7ae0', 2: '#6b4fb0', 1: '#3e2d6b'}, head: '#ff5a5a', body: ['#7fff6e', '#3fd13a'] }, // purple
  { caps: {4: '#ff7f7f', 3: '#d44', 2: '#a22', 1: '#601414'}, head: '#fff6a0', body: ['#ff9f9f', '#e56b6b'] },  // red
];

function startCrawler() {
  playTrack('crawler');
  crawler = { mush: new Map(), chains: [], px: W/2, py: crZoneBottom() - 30, bullets: [], cd: 0,
              fleas: [], spiders: [], lives: 3, inv: 0, score: 0, wave: 1, nextLife: 12000,
              timer: 0, fleaT: 900, spiderT: 1500, countdown: 180, banner: 120, reason: '', tick: 0 };
  for (let i = 0; i < 26; i++) crawlerAddMushroom(crawler);
  crawlerSpawnCentipede(crawler);
  crawler.countdown = 180;
  state = 'crawler'; crawlerPtr = null;
}

// frames per centipede move: faster each wave, and faster once only a few segments are left
function crawlerStepFrames(c) {
  const segs = c.chains.reduce((n, ch) => n + ch.segs.length, 0);
  return Math.max(3, 8 - (c.wave - 1) - (segs < 6 ? 2 : 0));
}

function crawlerStepChains(c) {
  const occ = new Set();
  c.chains.forEach(ch => ch.segs.forEach(p => occ.add(crKey(p.x, p.y))));
  const blocked = (x, y) => x < 0 || x >= CR.COLS || y < 0 || y >= CR.ROWS || c.mush.has(crKey(x, y)) || occ.has(crKey(x, y));
  for (const ch of c.chains) {
    const h = ch.segs[0], dir0 = ch.dir, nx = h.x + dir0;
    let np = null;
    if (!blocked(nx, h.y)) np = {x: nx, y: h.y};
    else {                                         // hit a wall or mushroom: drop a row (or climb if you can't) and reverse
      ch.dir = -dir0;
      if (!blocked(h.x, h.y + 1)) np = {x: h.x, y: h.y + 1};
      else if (!blocked(h.x, h.y - 1)) np = {x: h.x, y: h.y - 1};
      else {                                       // boxed in by mushrooms and its own body: chew through one (ahead, then down, then up)
        const chew = (x, y) => { const k = crKey(x, y); if (x >= 0 && x < CR.COLS && c.mush.has(k)) { c.mush.delete(k); return {x, y}; } return null; };
        np = chew(nx, h.y) || chew(h.x, h.y + 1) || chew(h.x, h.y - 1);
        if (np && np.x === nx) ch.dir = dir0;
      }
    }
    if (!np) {                                     // still stuck, often against another piece: slip past it onto any open cell that is not a mushroom or its own body
      const own = new Set(ch.segs.map(p => crKey(p.x, p.y)));
      for (const [dx, dy] of [[dir0, 0], [0, 1], [0, -1], [-dir0, 0]]) {
        const x = h.x + dx, y = h.y + dy;
        if (x >= 0 && x < CR.COLS && y >= 0 && y < CR.ROWS && !c.mush.has(crKey(x, y)) && !own.has(crKey(x, y))) { np = {x, y}; break; }
      }
    }
    if (!np && ch.segs.length > 1) {                // no way out at all: the centipede turns round, so its tail becomes the head and can move off
      ch.segs.reverse();
      ch.dir = Math.sign(ch.segs[0].x - ch.segs[1].x) || ch.dir;   // face away from its body
    }
    // going round in circles: if the head keeps returning to the same few cells, push it out, down towards the player first
    if (np) {
      const hk = crKey(np.x, np.y), hist = ch.hist || (ch.hist = []);
      if (hist.filter(k => k === hk).length >= 3) {
        const own = new Set(ch.segs.map(p => crKey(p.x, p.y)));
        for (const [dx, dy] of [[0, 1], [dir0, 0], [-dir0, 0], [0, -1]]) {
          const x = h.x + dx, y = h.y + dy, k = crKey(x, y);
          if (x >= 0 && x < CR.COLS && y >= 0 && y < CR.ROWS && !c.mush.has(k) && !own.has(k)) { np = {x, y}; break; }
        }
        if (np && crKey(np.x, np.y) === hk && h.y + 1 < CR.ROWS && c.mush.has(crKey(h.x, h.y + 1))) {   // sealed in: chew down through the mushroom
          c.mush.delete(crKey(h.x, h.y + 1)); np = {x: h.x, y: h.y + 1};
        }
        ch.hist.length = 0;
      }
      hist.push(crKey(np.x, np.y)); if (hist.length > 40) hist.shift();
    }
    if (np) { ch.segs.unshift(np); ch.segs.pop(); }   // the body follows the head
  }
}

function crawlerSplit(c, ci, si) {
  const ch = c.chains[ci], p = ch.segs[si], px = crPX(p.x), py = crPY(p.y);
  c.mush.set(crKey(p.x, p.y), 4);                     // the shot segment leaves a mushroom behind
  c.score += si === 0 ? 100 : 10;
  boom(px, py, si === 0 ? '#f44' : '#9f3', 14); crSfx.split();
  const head = ch.segs.slice(0, si), tail = ch.segs.slice(si + 1);
  c.chains.splice(ci, 1);
  if (head.length) c.chains.push({segs: head, dir: ch.dir});
  if (tail.length) c.chains.push({segs: tail, dir: -ch.dir});   // the back half now crawls the other way
}

function crawlerBullets(c) {
  for (const b of c.bullets) {
    b.y -= 9;
    if (b.y < CR.OY) { b.dead = true; continue; }
    const k = crKey(Math.floor((b.x - CR.OX) / CR.CELL), Math.floor((b.y - CR.OY) / CR.CELL));
    if (c.mush.has(k)) {
      const hp = c.mush.get(k) - 1;
      if (hp <= 0) { c.mush.delete(k); c.score += 1; boom(b.x, b.y, '#2ef2c8', 8); } else c.mush.set(k, hp);
      crSfx.hit(); b.dead = true; continue;
    }
    let done = false;
    for (let ci = 0; ci < c.chains.length && !done; ci++) {
      const segs = c.chains[ci].segs;
      for (let si = 0; si < segs.length; si++) {
        if (Math.hypot(crPX(segs[si].x) - b.x, crPY(segs[si].y) - b.y) < 11) { crawlerSplit(c, ci, si); b.dead = true; done = true; break; }
      }
    }
    if (done) continue;
    for (const f of c.fleas) if (!f.dead && Math.hypot(f.x - b.x, f.y - b.y) < 14) { f.dead = true; b.dead = true; c.score += 200; boom(f.x, f.y, '#f6f', 16); floater(f.x, f.y - 14, '+200', '#f6f'); crSfx.hit(); done = true; break; }
    if (done) continue;
    for (const sp of c.spiders) if (!sp.dead && Math.hypot(sp.x - b.x, sp.y - b.y) < 18) { sp.dead = true; b.dead = true; c.score += 300; boom(sp.x, sp.y, '#a6f', 26); floater(sp.x, sp.y - 16, '+300', '#a6f'); sfx.pop(); break; }
  }
  c.bullets = c.bullets.filter(b => !b.dead);
  c.fleas = c.fleas.filter(f => !f.dead);
  c.spiders = c.spiders.filter(sp => !sp.dead);
}

function crawlerFleas(c) {
  c.fleaT--;
  if (c.fleaT <= 0) {
    c.fleas.push({x: 20 + Math.random() * (W - 40), y: CR.OY - 10, row: -1});
    c.fleaT = Math.max(260, 620 - c.wave * 40) + Math.random() * 200;
  }
  for (const f of c.fleas) {
    f.y += 2.4 + Math.min(1.6, c.wave * 0.1);
    const row = Math.floor((f.y - CR.OY) / CR.CELL);
    if (row !== f.row) {                              // a flea leaves mushrooms as it falls
      f.row = row;
      if (row >= 0 && row < CR.ZONE && Math.random() < 0.5) {
        const k = crKey(Math.floor((f.x - CR.OX) / CR.CELL), row);
        if (!c.mush.has(k)) { c.mush.set(k, 4); }
      }
    }
  }
  c.fleas = c.fleas.filter(f => f.y < H + 20);
}

function crawlerSpiders(c) {
  c.spiderT--;
  if (c.wave >= 2 && c.spiderT <= 0 && c.spiders.length < 1) {
    const left = Math.random() < 0.5;
    c.spiders.push({x: left ? -20 : W + 20, dir: left ? 1 : -1, t: Math.random() * 6, y: 0});
    c.spiderT = 900 + Math.random() * 600;
  }
  for (const sp of c.spiders) { sp.x += sp.dir * 1.6; sp.t += 0.05; sp.y = crPY(CR.ZONE - 3 + Math.sin(sp.t) * 1.6); }
  c.spiders = c.spiders.filter(sp => sp.x > -40 && sp.x < W + 40);
}

function crawlerCollide(c) {
  if (c.inv > 0) return;
  for (const ch of c.chains) for (const p of ch.segs) if (Math.hypot(crPX(p.x) - c.px, crPY(p.y) - c.py) < 16) return crawlerHit(c, 'CAUGHT BY THE CENTIPEDE');
  for (const f of c.fleas) if (Math.hypot(f.x - c.px, f.y - c.py) < 16) return crawlerHit(c, 'BITTEN BY A FLEA');
  for (const sp of c.spiders) if (Math.hypot(sp.x - c.px, sp.y - c.py) < 20) return crawlerHit(c, 'CAUGHT BY A SPIDER');
}
function crawlerHit(c, reason) {
  c.lives--; c.inv = 120; c.px = W/2; c.py = crZoneBottom() - 30; shake = 18;
  boom(c.px, c.py, '#f66', 30); sfx.ouch();
  if (c.lives <= 0) return crawlerDie(reason);
  crawlerRestartWave(c);
}
// getting hit restarts the wave, as in the original: the centipede starts again from the top at full length.
// The mushrooms stay where they are, and the score and lives carry on.
function crawlerRestartWave(c) {
  const len = Math.min(16, 8 + 2 * (c.wave - 1));
  const segs = [];
  for (let i = 0; i < len; i++) segs.push({x: len - 1 - i, y: 0});
  c.chains = [{segs, dir: 1}];
  c.countdown = 120; c.banner = 120; c.timer = 0;
}

function crawlerUpdate() {
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; }); parts = parts.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 0.8; f.life--; }); floaters = floaters.filter(f => f.life > 0);
  if (shake > 0) shake--;
  const c = crawler;
  if (!c || state !== 'crawler') return;
  c.tick++;
  if (c.banner > 0) c.banner--;
  if (c.inv > 0) c.inv--;
  // steer with keys, or drag with a finger/mouse
  const sp = 4.5;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.a || keys.A) dx--;
  if (keys.ArrowRight || keys.d || keys.D) dx++;
  if (keys.ArrowUp || keys.w || keys.W) dy--;
  if (keys.ArrowDown || keys.s || keys.S) dy++;
  c.px += dx * sp; c.py += dy * sp;
  if (crawlerPtr) { c.px += Math.max(-9, Math.min(9, crawlerPtr.x - c.px)); c.py += Math.max(-9, Math.min(9, crawlerPtr.y - c.py)); }
  c.px = Math.max(16, Math.min(W - 16, c.px));
  c.py = Math.max(crZoneTop() + 14, Math.min(crZoneBottom() - 16, c.py));
  // manual fire: hold SPACE or the FIRE button; up to 3 shots on screen, like the original
  if (c.cd > 0) c.cd--;
  const firing = keys[' '] || crawlerFire;
  if (firing && c.cd === 0 && c.countdown === 0 && c.bullets.length < 3) { c.bullets.push({x: c.px, y: c.py - 16}); c.cd = 8; crSfx.fire(); }
  crawlerBullets(c);
  if (c.countdown > 0) { c.countdown--; return; }
  // the centipede moves on its own beat
  c.timer++;
  if (c.timer >= crawlerStepFrames(c)) { c.timer = 0; crawlerStepChains(c); crSfx.step(c.tick); }
  crawlerFleas(c); crawlerSpiders(c);
  if (state !== 'crawler') return;
  crawlerCollide(c);
  if (state !== 'crawler') return;
  if (c.chains.length === 0) { c.wave++; c.score += 500; crawlerSpawnCentipede(c); crSfx.wave(); }
  if (c.score >= c.nextLife) { c.nextLife += 12000; if (c.lives < 5) { c.lives++; sfx.life(); floater(c.px, c.py - 40, '1UP! EXTRA LIFE', '#6f6'); } }
}

function crawlerSaveBest() {
  if (crawler && crawler.score > crawlerBest) { crawlerBest = crawler.score; try { localStorage.setItem('sdCrawlerBest', crawlerBest); } catch(e) {} }
}
function crawlerDie(reason) {
  const c = crawler;
  c.reason = reason; state = 'crawlerOver'; crawlerOverAt = Date.now();
  boom(c.px, c.py, '#7ff', 60); shake = 22;
  stopMusic(); crSfx.die(); crawlerSaveBest(); loadBoard(true, CG);
}

function crawlerKey(e) {
  const k = e.key.toLowerCase();
  if (state === 'crawler') { if ((k === 'escape' || k === 'p') && !e.repeat) crawlerPause(); return; }
  if (e.repeat) return;
  if (state === 'crawlerPaused') {
    if (k === 'escape' || k === 'p' || k === ' ' || k === 'enter') crawlerResume();
    else if (k === 'q') crawlerQuit();
  } else if (state === 'crawlerOver') {
    if (k === 'escape' || k === 'q') crawlerQuit();
    else if ((k === ' ' || k === 'enter') && Date.now() - crawlerOverAt > 1200) startCrawler();
  }
}
function crawlerDown(e) {
  const x = pos(e), y = posY(e);
  if (state === 'crawler') {
    if (y < 64 && Math.abs(x - W/2) < 36) { crawlerPause(); return; }
    if (Math.hypot(x - CR_FIRE.x, y - CR_FIRE.y) < CR_FIRE.r + 10) { crawlerFire = true; return; }
    crawlerPtr = {x, y}; return;
  }
  if (state === 'crawlerPaused') { if (y > 375 && y < 445) crawlerQuit(); else crawlerResume(); return; }
  if (state === 'crawlerOver') { if (y > 668) crawlerQuit(); else if (Date.now() - crawlerOverAt > 1200) startCrawler(); }
}
function crawlerPause() { if (state !== 'crawler') return; state = 'crawlerPaused'; crawlerPtr = null; if (AC && AC.state === 'running') AC.suspend(); }
function crawlerResume() { if (state !== 'crawlerPaused') return; state = 'crawler'; if (AC) AC.resume(); }
function crawlerQuit() {
  if (state === 'crawlerPaused' && crawler && crawler.score > 0) { crawlerSaveBest(); loadBoard(true, CG); }
  stopMusic(); if (AC) AC.resume();
  state = 'hub';
}

// ---- drawing ----
function drawCrawlerArt(x, y, w, h) {
  const c = 22, ox = x + (w - 8*c)/2, oy = y + (h - 6*c)/2;
  const caps = ['#2ef2c8', '#24b89c', '#1a7f6c'];
  [[0,5,0],[2,0,1],[6,4,2],[7,1,1]].forEach(([mx, my, v]) => {
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(ox + mx*c + c/2 - 2, oy + my*c + c/2, 4, 7);
    ctx.fillStyle = caps[v]; ctx.beginPath(); ctx.arc(ox + mx*c + c/2, oy + my*c + c/2, 8, Math.PI, 0); ctx.fill();
  });
  [[1,0],[2,0],[3,0],[4,0],[4,1],[4,2],[3,2],[2,2]].forEach(([bx, by], i, arr) => {
    ctx.fillStyle = i === arr.length - 1 ? '#ff4d4d' : (i % 2 ? '#9f3' : '#6c2');
    ctx.beginPath(); ctx.arc(ox + bx*c + c/2, oy + by*c + c/2, 9, 0, 6.28); ctx.fill();
  });
  ctx.fillStyle = '#7ff'; ctx.beginPath(); ctx.moveTo(ox + 4*c + c/2, oy + 5*c); ctx.lineTo(ox + 4*c + c + c/2 - 2, oy + 6*c - 4); ctx.lineTo(ox + 4*c - c/2 + 2, oy + 6*c - 4); ctx.closePath(); ctx.fill();
}

function drawCrawlerWorld(c) {
  const C = CR.CELL, zy = crZoneTop();
  ctx.fillStyle = 'rgba(63,255,153,0.04)'; ctx.fillRect(0, zy, W, crZoneBottom() - zy);
  ctx.strokeStyle = 'rgba(63,255,153,0.35)'; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(0, zy + 0.5); ctx.lineTo(W, zy + 0.5); ctx.stroke(); ctx.setLineDash([]);
  // mushrooms: colour fades as they're damaged
  const pal = CRAWLER_PALETTES[(c.wave - 1) % CRAWLER_PALETTES.length], caps = pal.caps;
  for (const [k, hp] of c.mush) {
    const [x, y] = k.split(',').map(Number), cx = crPX(x), cy = crPY(y);
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(cx - 3, cy - 1, 6, 9);
    ctx.fillStyle = caps[hp]; ctx.beginPath(); ctx.arc(cx, cy - 1, 10, Math.PI, 0); ctx.fill();
    if (hp === 4) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(cx - 4, cy - 6, 3, 3); }
  }
  // centipede: red head, green body, legs that wiggle
  for (const ch of c.chains) ch.segs.forEach((p, i) => {
    const cx = crPX(p.x), cy = crPY(p.y), wig = Math.sin(c.tick / 3 + i) * 3;
    ctx.strokeStyle = i === 0 ? pal.head : pal.body[1]; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 5, cy + 6); ctx.lineTo(cx - 7, cy + 12 + wig); ctx.moveTo(cx + 5, cy + 6); ctx.lineTo(cx + 7, cy + 12 - wig); ctx.stroke();
    ctx.fillStyle = i === 0 ? pal.head : pal.body[i % 2];
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
    if (i === 0) { ctx.fillStyle = '#000'; ctx.fillRect(cx + ch.dir * 4 - 1.5, cy - 4, 3, 3); }
  });
  // fleas: fast magenta drops
  for (const f of c.fleas) {
    ctx.fillStyle = '#f6f'; ctx.shadowColor = '#f6f'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(f.x, f.y, 7, 10, 0, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#f6f'; ctx.lineWidth = 1.5; const wig = Math.sin(c.tick / 2) * 3;
    ctx.beginPath(); ctx.moveTo(f.x - 6, f.y - 3); ctx.lineTo(f.x - 12, f.y + wig); ctx.moveTo(f.x + 6, f.y - 3); ctx.lineTo(f.x + 12, f.y - wig); ctx.stroke();
  }
  // spiders: zigzag above your zone, bouncing legs
  for (const sp of c.spiders) {
    ctx.fillStyle = '#a6f'; ctx.shadowColor = '#a6f'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 11, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#a6f'; ctx.lineWidth = 2; const wig = Math.sin(c.tick / 4) * 4;
    for (const side of [-1, 1]) for (const [ly, lw] of [[-6, 1], [0, -1], [6, 1]]) {
      ctx.beginPath(); ctx.moveTo(sp.x + side*8, sp.y + ly/2); ctx.lineTo(sp.x + side*18, sp.y + ly + wig*lw); ctx.stroke();
    }
  }
  // your shots
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#7ff'; ctx.shadowBlur = 8;
  for (const b of c.bullets) ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12);
  ctx.shadowBlur = 0;
  // your ship (blinks while invulnerable)
  if (!(c.inv > 0 && Math.floor(c.inv / 4) % 2)) {
    ctx.fillStyle = '#7ff'; ctx.shadowColor = '#7ff'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(c.px, c.py - 14); ctx.lineTo(c.px + 14, c.py + 10); ctx.lineTo(c.px - 14, c.py + 10); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.fillRect(c.px - 2, c.py - 18, 4, 6);
  }
}

function drawCrawlerHUD(c) {

  glowText('WAVE ' + c.wave, W/2, 84, 14, '#3f9', 'center', 0);

function drawCrawlerOver(c) {

function drawCrawlerFrame() {
  const c = crawler;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.fillStyle = '#020608'; ctx.fillRect(-30, -30, W + 60, H + 60);
  if (c) drawCrawlerWorld(c);
  parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.life/30); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
  ctx.globalAlpha = 1;
  floaters.forEach(f => { ctx.globalAlpha = Math.min(1, f.life/20); glowText(f.text, f.x, f.y, 16, f.color, 'center', 6); });
  ctx.globalAlpha = 1;
  if (c) drawCrawlerHUD(c);
  if (state === 'crawlerPaused') drawPaused();
  else if (state === 'crawlerOver' && c) drawCrawlerOver(c);
  ctx.restore();
  ctx.drawImage(scan, 0, 0);
}

function draw() {
  if (state.startsWith('snake')) return drawSnakeFrame();
  if (state.startsWith('crawler')) return drawCrawlerFrame();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.fillStyle = '#07021a'; ctx.fillRect(-30,-30,W+60,H+60);
  // retro perspective grid at the bottom
  ctx.strokeStyle = 'rgba(255,61,240,0.12)'; ctx.lineWidth = 1;
  for (let i=0;i<8;i++){ const y = H*0.55 + Math.pow(i/8,2)*H*0.45 + ((t*0.5)%1); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for (let i=-6;i<=6;i++){ ctx.beginPath(); ctx.moveTo(W/2+i*20,H*0.55); ctx.lineTo(W/2+i*90,H); ctx.stroke(); }
  stars.forEach(s => { ctx.globalAlpha = 0.4 + s.s/4; ctx.fillStyle = s.s > 2 ? '#aef' : '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s*(state==='play'?2:1)); });
  ctx.globalAlpha = 1;

  rocks.forEach(r => {
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.fillStyle = r.hitFlash > 0 ? '#fff' : '#8a7a6a'; ctx.strokeStyle = '#ffb86b'; ctx.lineWidth = 3; ctx.shadowColor = '#ff9a3d'; ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i=0;i<9;i++){ const a=i/9*6.28, d=r.r*(0.8+0.2*Math.sin(i*7+r.seed)); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(r.r*0.3, -r.r*0.2, r.r*0.2, 0, 6.28); ctx.fill();
    ctx.restore();
  });
  orbs.forEach(o => {
    const c = ORB[o.type].color;
    ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.drop ? 12 + Math.sin(t/3)*2 : 12, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#000'; ctx.font = `bold 15px ${FONT}`; ctx.textAlign='center'; ctx.fillText(ORB[o.type].letter, o.x, o.y+5);
  });
  // bullets
  bullets.forEach(b => { ctx.fillStyle = '#7ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 10; ctx.fillRect(b.x-2, b.y-8, 4, 14); });
  ctx.shadowBlur = 0;

  if (state === 'play' || state === 'paused') {
    if (!(ship.inv > 0 && Math.floor(t/4)%2)) {
      const ships = ship.twin ? [[ship.x, '#ff3df0'], [ship.x + ship.wing, '#c8f']] : [[ship.x, '#ff3df0']];
      for (const [sx, col] of ships) {
        drawShip(sx, ship.y, 1, col);
        if (ship.shield > 0) { ctx.strokeStyle = `rgba(90,238,255,${ship.shield<90 ? 0.3+0.4*Math.sin(t) : 0.7})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,ship.y,30,0,6.28); ctx.stroke(); }
      }
    }
  }
  rings.forEach(g => { const k = 1 - g.life/22; ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ffd89a'; ctx.lineWidth = 4*(1-k)+1; ctx.shadowColor = '#ff9a3d'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r*(0.6 + k*1.8), 0, 6.28); ctx.stroke(); ctx.shadowBlur = 0; });
  parts.forEach(p => { ctx.globalAlpha = Math.min(1,p.life/30);
    if (p.chunk) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.strokeStyle = '#ffb86b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-p.size, -p.size*0.4); ctx.lineTo(p.size*0.2, -p.size); ctx.lineTo(p.size, p.size*0.5); ctx.lineTo(-p.size*0.3, p.size*0.8); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    else { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); } });
  ctx.globalAlpha = 1;
  floaters.forEach(f => { ctx.globalAlpha = Math.min(1, f.life/20); glowText(f.text, f.x, f.y, 16, f.color, 'center', 6); });
  ctx.globalAlpha = 1;

  if (state === 'play') drawHUD();
  else if (state === 'paused') { drawHUD(); drawPaused(); }
  else if (state === 'title') drawTitle();
  else if (state === 'hub') drawHub();
  else if (state === 'board') drawBoard();
  else drawOver();

  if (flash > 0) { ctx.fillStyle = `rgba(255,60,60,${flash/16})`; ctx.fillRect(-30,-30,W+60,H+60); }
  ctx.restore();
  ctx.drawImage(scan, 0, 0);   // CRT scanlines + vignette
}

    top: '#0b3d1f', bottom: '#02100a', accent: '#5f5', glow: '#fd3',
    art: drawSnakeArt, hi: () => snakeBest,
    start: () => { if (!playerName) openName(startSnake); else startSnake(); } },
  { id: 'crawler', title: ['CRAWLER', ''], tag: 'SHOOT THE CRAWLING LINE.',
    top: '#06302c', bottom: '#020808', accent: '#3f9', glow: '#7ff',
    art: drawCrawlerArt, hi: () => crawlerBest,
    start: () => { if (!playerName) openName(startCrawler); else startCrawler(); } },
  { id: 'adventure', title: ['ITAP', 'ADVENTURE'], tag: 'EXPLORE THE VILLAGE.',
    top: '#1d3a14', bottom: '#060d05', accent: '#9e6', glow: '#fd7',
    art: drawAdventureArt, hi: null,
    start: () => { location.href = 'adventure/'; } },
];

// the banner for ITAP Adventure: a village green, a house with a path, and an oak
function drawAdventureArt(x, y, w, h) {
  const cx = x + w/2, gy = y + h*0.72;
  ctx.fillStyle = '#2f6b2a'; ctx.fillRect(x, gy, w, h - (gy - y));
  ctx.fillStyle = '#b09060'; ctx.beginPath(); ctx.moveTo(cx - 14, y + h); ctx.lineTo(cx + 30, y + h); ctx.lineTo(cx + 12, gy); ctx.lineTo(cx - 4, gy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a6a4a'; ctx.fillRect(cx - 70, gy - 62, 96, 62);
  ctx.fillStyle = '#7a2e2e'; ctx.beginPath(); ctx.moveTo(cx - 80, gy - 60); ctx.lineTo(cx - 22, gy - 104); ctx.lineTo(cx + 36, gy - 60); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a2a16'; ctx.fillRect(cx - 52, gy - 26, 18, 26);
  ctx.fillStyle = '#5a3a1e'; ctx.fillRect(cx + 74, gy - 40, 8, 40);
  ctx.fillStyle = '#3f8a3a'; ctx.beginPath(); ctx.arc(cx + 78, gy - 52, 26, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#2f7a2c'; ctx.beginPath(); ctx.arc(cx + 66, gy - 62, 18, 0, 6.28); ctx.fill();
}
function drawDodgerArt(x, y, w, h) {
  const cx = x + w/2, hz = y + h*0.55;
  ctx.strokeStyle = 'rgba(255,61,240,0.4)'; ctx.lineWidth = 1;
  for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(cx + i*8, hz); ctx.lineTo(cx + i*30, y + h); ctx.stroke(); }
  for (let j = 1; j <= 4; j++) { const yy = hz + (y + h - hz) * (j/4) * (j/4); ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke(); }
  ctx.strokeStyle = '#ffb86b'; ctx.fillStyle = '#6a5d50'; ctx.lineWidth = 3; ctx.shadowColor = '#ff9a3d'; ctx.shadowBlur = 10;
  for (const [ax, ay, r] of [[-95, 30, 26], [90, -20, 18], [-30, -70, 14], [60, 40, 12]]) {
    ctx.beginPath(); ctx.arc(cx + ax, y + h*0.3 + ay, r, 0, 6.28); ctx.fill(); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  drawShip(cx, y + h*0.78, 1.5);
}

function drawHub() {
  const g = GAMES[hubSel], cx = W/2, x = 70, y = 150, w = 340, h = 420;
  ctx.fillStyle = 'rgba(0,0,10,0.55)'; ctx.fillRect(0, 60, W, 640);
  glowText('ARCADE', cx, 96, 44, '#5ef', 'center', 22);
  glowText('SELECT A GAME', cx, 124, 14, '#fd3', 'center', 4);
  // banner: themed per game
  const grd = ctx.createLinearGradient(0, y, 0, y + h); grd.addColorStop(0, g.top); grd.addColorStop(1, g.bottom);
  ctx.save(); ctx.shadowColor = g.accent; ctx.shadowBlur = 24; ctx.fillStyle = grd; ctx.fillRect(x, y, w, h); ctx.restore();
  ctx.strokeStyle = g.accent; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h);
  glowText(`GAME ${hubSel + 1} OF ${GAMES.length}`, cx, y + 22, 12, '#889', 'center', 0);
  if (g.title[1]) { glowText(g.title[0], cx, y + 80, 46, g.glow, 'center', 18); glowText(g.title[1], cx, y + 126, 46, g.accent, 'center', 18); }
  else glowText(g.title[0], cx, y + 104, 46, g.glow, 'center', 18);
  g.art(x + 20, y + 150, w - 40, 190);
  glowText(g.tag, cx, y + 372, 13, '#fff', 'center', 0);
  if (g.hi) glowText('HI-SCORE ' + pad(g.hi()), cx, y + 400, 16, '#fd3', 'center', 6);
  // carousel arrows and dots (only when there is more than one game)
  if (GAMES.length > 1) {
    glowText('◀', 40, 360, 34, '#fff', 'center', 8);
    glowText('▶', 440, 360, 34, '#fff', 'center', 8);
    GAMES.forEach((_, i) => { ctx.fillStyle = i === hubSel ? g.accent : '#445'; ctx.beginPath(); ctx.arc(cx + (i - (GAMES.length - 1)/2) * 22, 596, 6, 0, 6.28); ctx.fill(); });
  }
  if (Math.floor(Date.now()/500) % 2) glowText('PRESS SPACE OR TAP TO PLAY', cx, 644, 17, '#fff', 'center', 8);
  if (GAMES.length > 1) glowText('← → CHOOSE   SPACE PLAY', cx, 680, 13, '#889', 'center', 0);
}

function hubMove(d) {
  if (GAMES.length < 2) return;
  initAudio(); sfx.pew();
  hubSel = (hubSel + d + GAMES.length) % GAMES.length;
}
function hubPick() { initAudio(); sfx.power(); GAMES[hubSel].start(); }
function hubKey(e) {
  initAudio();
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') hubMove(-1);
  else if (k === 'arrowright' || k === 'd') hubMove(1);
  else if (k === ' ' || k === 'enter') hubPick();
}
function hubTap(x, y) {
  initAudio();
  if (x < 70 && y > 290 && y < 430) hubMove(-1);
  else if (x > 410 && y > 290 && y < 430) hubMove(1);
  else if (x >= 70 && x <= 410 && y >= 150 && y <= 570) hubPick();
}

function drawTitle() {
  const wob = Math.sin(Date.now()/400) * 4;
  glowText('< ARCADE', 16, 34, 14, '#5ef', 'left', 0);
  glowText('SPACE', W/2, 200 + wob, 66, '#5ef', 'center', 25);
  glowText('DODGER', W/2, 270 + wob, 66, '#ff3df0', 'center', 25);
  glowText('← → / A D  MOVE', W/2, 390, 18, '#fff', 'center', 0);
  glowText('S SHIELD  T TURBO', W/2, 462, 16, '#5ef', 'center', 0);
  glowText('R RAPID FIRE  (drops from rocks)', W/2, 486, 16, '#f66', 'center', 0);
  glowText('D DUAL FIGHTER', W/2, 510, 16, '#c8f', 'center', 0);
  glowText('PRESS SPACE OR TAP TO START', W/2, 600, 14, '#aaa', 'center', 0);
  glowText('PILOT: ' + (playerName || '???') + '  [N] CHANGE', W/2, 642, 16, '#5ef', 'center', 6);
  glowText('HI-SCORE ' + pad(best), W/2, 672, 18, '#fd3', 'center', 6);
  glowText('[L] LEADERBOARD', W/2, 704, 15, '#ff3df0', 'center', 6);
}

function drawRows(top, y0, rowH, size) {
  const mine = nameKey(playerName);
  if (boardStatus === 'loading') { glowText('LOADING...', W/2, y0 + 30, 18, '#889', 'center', 0); return; }
  if (!board.length) { glowText('NO SCORES YET', W/2, y0 + 30, 18, '#889', 'center', 0); return; }
  board.slice(0, top).forEach((r, i) => {
    const y = y0 + i * rowH, you = nameKey(r.name) === mine, c = you ? '#ff0' : (i === 0 ? '#fd3' : '#fff');
    glowText(String(i + 1).padStart(2, ' ') + '.', 90, y, size, c, 'left', you ? 8 : 0);
    const nm = typeof r.name === 'string' ? r.name.slice(0, 12) : '?'; glowText(badName(nm) ? '*'.repeat(nm.length) : nm, 135, y, size, c, 'left', you ? 8 : 0);
    glowText(pad(r.score), W - 90, y, size, c, 'right', you ? 8 : 0);
  });
}
function boardLabel() { return boardIsGlobal ? 'ONLINE - ALL PLAYERS' : (boardStatus === 'offline' ? 'OFFLINE - THIS DEVICE ONLY' : 'THIS DEVICE ONLY'); }

function drawOver() {
  ctx.fillStyle = 'rgba(0,0,10,0.72)'; ctx.fillRect(0, 130, W, 560);
  glowText('GAME OVER', W/2, 200, 54, '#f44', 'center', 22);
  glowText(playerName + '  ' + pad(score), W/2, 245, 24, '#fff', 'center', 6);
  glowText(score >= best && score > 0 ? '★ NEW HIGH SCORE! ★' : 'STAGE ' + stage + '  BEST ' + pad(best), W/2, 276, 17, '#fd3', 'center', 8);
  glowText('- TOP PILOTS -', W/2, 325, 18, '#ff3df0', 'center', 8);
  drawRows(8, 358, 25, 18);
  if (Date.now() - overAt > 1200) {
    glowText('TRY AGAIN?', W/2, 610, 34, '#fff', 'center', 14);
    if (Math.floor(Date.now()/500)%2) glowText('PRESS SPACE OR TAP', W/2, 642, 17, '#5ef', 'center', 8);
    glowText('ARCADE MENU  (ESC or tap here)', W/2, 698, 15, '#ff3df0', 'center', 6);
  }
}

function drawBoard() {
  ctx.fillStyle = 'rgba(0,0,10,0.78)'; ctx.fillRect(0, 40, W, 650);
  glowText('LEADERBOARD', W/2, 92, 36, '#5ef', 'center', 18);
  glowText(boardLabel(), W/2, 120, 13, boardIsGlobal ? '#6f6' : '#fd3', 'center', 4);
  drawRows(25, 165, 20, 15);
  if (Math.floor(Date.now()/500)%2) glowText('PRESS SPACE OR TAP', W/2, 676, 16, '#fff', 'center', 8);
}

(function loop(){ if (state === 'hub' && AC && !musicOn) playTrack('hub'); if (state.startsWith('snake')) snakeUpdate(); else if (state.startsWith('crawler')) crawlerUpdate(); else update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
