const LEET = {'@':'A','$':'S','!':'I','|':'I','0':'O','3':'E','4':'A','5':'S','7':'T','8':'B'};
const _badCache = new Map();
function badName(name) {

}
function _badName(name) {
  const raw = String(name).toUpperCase();
  const leet = one => raw.replace(/[@$!|0134578]/g, c => c === '1' ? one : LEET[c]);   // catches $H1T, F4G, etc.
  for (const v of [leet('I'), leet('L'), raw]) {
    const compact = v.replace(/[^A-Z0-9]/g, '');                                 // catches F U C K, F.U.C.K
    if (BAD_SUB.some(w => compact.includes(w)) || BAD_WORD.has(compact)) return true;
    if (v.split(/[^A-Z0-9]+/).some(tok => tok && BAD_WORD.has(tok))) return true;
  }
  return false;
}

// ---------- FIT TO ANY SCREEN ----------
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight, pad = 10, border = 6;
  const k = Math.max(0.2, Math.min((vw - pad - border) / W, (vh - pad - border) / H, 1.6));   // keep 2:3 shape, up to 1.6x on big screens
  cv.style.width = Math.floor(W * k + border) + 'px'; cv.style.height = Math.floor(H * k + border) + 'px';
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

// ---------- INPUT ----------
addEventListener('keydown', e => {
  if (modalOpen) return;   // typing a name: don't treat keys as game controls
  keys[e.key] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && state !== 'play') activate();
  if (state === 'title' && !e.repeat) { if (e.key === 'n' || e.key === 'N') openName(null); if (e.key === 'l' || e.key === 'L') showBoard(); }
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
addEventListener('keyup', e => keys[e.key] = false);
function pos(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left - 3) * W / (r.width - 6); }
function posY(e){ const r = cv.getBoundingClientRect(); return (e.clientY - r.top - 3) * H / (r.height - 6); }
cv.addEventListener('pointerdown', e => {
  if (modalOpen) return;
  if (state === 'play') { touchX = pos(e); return; }
  const y = posY(e);
  if (state === 'title' && y > 622 && y < 655) { openName(null); return; }   // tap PLAYER line to change name
  if (state === 'title' && y > 690) { showBoard(); return; }                  // tap LEADERBOARD
  activate();
});
cv.addEventListener('pointermove', e => { if (touchX !== null) touchX = pos(e); });
addEventListener('pointerup', () => touchX = null);
addEventListener('pointercancel', () => touchX = null);

let AC = null, master = null, muted = false, musicOn = false, nextNote = 0, step = 0, musicTimer = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
}
function tone(freq, start, dur, type='square', vol=0.15, slideTo=null) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, start);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
  g.gain.setValueAtTime(vol, start); g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  o.connect(g); g.connect(master); o.start(start); o.stop(start + dur + 0.02);
}
function noise(start, dur, vol=0.3) {
  if (!AC) return;
  const buf = AC.createBuffer(1, Math.max(1, AC.sampleRate * dur), AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(master); s.start(start);
}
const sfx = {
  pew()    { if (!AC) return; const n = AC.currentTime; tone(1100, n, 0.09, 'square', 0.07, 300); },
  hit()    { if (!AC) return; const n = AC.currentTime; tone(180, n, 0.06, 'square', 0.1, 120); },
  pop()    { if (!AC) return; const n = AC.currentTime; noise(n, 0.18, 0.25); tone(260, n, 0.14, 'square', 0.12, 70); },
  power()  { if (!AC) return; const n = AC.currentTime; [523,659,784,1047].forEach((f,i) => tone(f, n+i*0.06, 0.15, 'triangle', 0.2)); },
  life()   { if (!AC) return; const n = AC.currentTime; [392,523,659,784,1047,1319].forEach((f,i) => tone(f, n+i*0.07, 0.18, 'square', 0.1)); },
  stage()  { if (!AC) return; const n = AC.currentTime; [330,392,494,659].forEach((f,i) => tone(f, n+i*0.09, 0.2, 'square', 0.1)); },
  ouch()   { if (!AC) return; const n = AC.currentTime; noise(n, 0.5, 0.4); tone(200, n, 0.5, 'sawtooth', 0.2, 50); },
  crash()  { if (!AC) return; const n = AC.currentTime; noise(n, 1.0, 0.5); tone(220, n, 0.9, 'sawtooth', 0.25, 35); },
};
const BASS = [110,110,110,110, 87.3,87.3,87.3,87.3, 130.8,130.8,130.8,130.8, 98,98,98,98];
const ARP  = [[220,262,330],[175,220,262],[262,330,392],[196,247,294]];
function scheduleMusic() {
  if (!musicOn || !AC) return;
  const bpm = 130 + Math.min(score / 400, 50), stepLen = 60 / bpm / 4;
  while (nextNote < AC.currentTime + 0.2) {
    const bar = Math.floor(step / 4) % 4, i = step % 16;
    tone(BASS[i], nextNote, stepLen * 0.9, 'triangle', 0.22);
    tone(ARP[bar][step % 3], nextNote, stepLen * 0.6, 'square', 0.07);
    if (step % 4 === 0) noise(nextNote, 0.04, 0.12);
    if (step % 16 >= 12 && step % 2 === 0) tone(ARP[bar][2]*2, nextNote, stepLen*0.5, 'square', 0.05);
    nextNote += stepLen; step++;

function stopMusic() { musicOn = false; clearInterval(musicTimer); }
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }

const nameModal = document.getElementById('nameModal'), nameInput = document.getElementById('nameInput'), nameErr = document.getElementById('nameErr');

  const n = nameInput.value.replace(/[^A-Za-z0-9 _-]/g, '').trim().toUpperCase().slice(0, 12);

// --- leaderboard storage: local (always) + online (if LEADERBOARD_URL is set) ---
function localBoard() { try { return JSON.parse(localStorage.getItem('sdBoard') || '[]'); } catch(e) { return []; } }
function saveLocal(name, sc) {
  const list = localBoard(), k = nameKey(name), me = list.find(r => nameKey(r.name) === k);
  if (me) { if (sc > me.score) me.score = sc; } else list.push({name, score: sc});
  list.sort((a, b) => b.score - a.score);
  try { localStorage.setItem('sdBoard', JSON.stringify(list.slice(0, 25))); } catch(e) {}
  return list.slice(0, 25);
}
async function fetchGlobal() {
  const res = await fetch(LEADERBOARD_URL.replace(/\/$/, '') + '/scores.json?orderBy="score"&limitToLast=25', {cache: 'no-store'});
  if (!res.ok) throw new Error('bad response');
  const data = (await res.json()) || {};
  return Object.values(data).filter(r => r && typeof r.score === 'number').sort((a, b) => b.score - a.score).slice(0, 25);
}
async function submitGlobal(name, sc) {
  const key = nameKey(name), pbKey = 'sdPB_' + key; let pb = 0;
  try { pb = +(localStorage.getItem(pbKey) || 0); } catch(e) {}
  if (sc <= pb) return;     // only post a new personal best
  const res = await fetch(LEADERBOARD_URL.replace(/\/$/, '') + '/scores/' + key + '.json', {method: 'PUT', body: JSON.stringify({name, score: sc, ts: Date.now()})});
  if (res.ok) { try { localStorage.setItem(pbKey, sc); } catch(e) {} }
}
async function loadBoard(submit) {
  boardStatus = 'loading'; const mine = nameKey(playerName);
  const local = submit ? saveLocal(playerName, score) : localBoard();
  if (!LEADERBOARD_URL) { board = local; boardIsGlobal = false; boardStatus = 'ok'; return; }
  try {
    if (submit) await submitGlobal(playerName, score);
    board = await fetchGlobal(); boardIsGlobal = true; boardStatus = 'ok';
  } catch(e) { board = local; boardIsGlobal = false; boardStatus = 'offline'; }
}
function showBoard() { state = 'board'; loadBoard(false); }

function start() {
  startMusic();
  state = 'play'; score = 0; t = 0; spawnTimer = 30; nextLife = LIFE_EVERY; lifeCount = 0; banner2 = 0; shake = 0; stage = 1; banner = 120; combo = 0; comboTimer = 0;
  ship = {x:W/2, y:H-90, shield:0, boost:0, rapid:0, cd:0, lives:3, inv:90, twin:false, wing:0};
  rocks = []; orbs = []; bullets = []; parts = []; floaters = []; rings = [];
  sfx.stage();
}

function boom(x, y, color, n=24) {
  for (let i=0;i<n;i++) { const a=Math.random()*6.28, s=Math.random()*5+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*30,color}); }
}
function floater(x, y, text, color='#fff') { floaters.push({x,y,text,color,life:50}); }
function addScore(n, x, y) { score += n; floater(x, y, '+' + n + (combo > 1 ? ' x' + combo : ''), combo > 1 ? '#ff0' : '#fff'); }

function makeRock(x, y, r, vy, vx) {
  return {x, y, r, vy, vx, rot:0, vr:(Math.random()-0.5)*0.1, hp: r > 34 ? 3 : r > 22 ? 2 : 1, hitFlash:0, seed:Math.random()*10};
}

function pickOrb() {
  const bag = ['shield','turbo','rapid','rapid','twin'];
  return bag[Math.floor(Math.random()*bag.length)];
}

function killRock(r) {
  r.dead = true;
  combo = comboTimer > 0 ? Math.min(5, combo + 1) : 1; comboTimer = 150;
  addScore(Math.round(r.r) * 2 * combo, r.x, r.y);
  boom(r.x, r.y, '#fa6', 14 + Math.round(r.r / 2)); sfx.pop(); shake = Math.max(shake, 4);
  rings.push({x:r.x, y:r.y, r:r.r, life:22});
  // bigger rocks have a better chance to drop a power-up (~4% small ... ~8% big)
  if (Math.random() < 0.025 + r.r * 0.0015) { const typ = pickOrb(); orbs.push({x:r.x, y:r.y, type:typ, drop:true}); floater(r.x, r.y - 22, 'DROP!', ORB[typ].color); }
  for (let i = 0; i < 5 + Math.round(r.r / 8); i++) {       // tumbling rock chunks that fade away
    const a = Math.random()*6.28, sp = 1 + Math.random()*4;
    parts.push({x:r.x, y:r.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:35+Math.random()*30, color:'#a89684', chunk:true, rot:Math.random()*6, vr:(Math.random()-0.5)*0.5, size:3+Math.random()*r.r*0.25});
  }
  if (r.r >= 24) for (const d of [-1, 1]) rocks.push(makeRock(r.x + d*8, r.y, r.r*0.6, r.vy + 0.5, d*(1 + Math.random())));
}

function update() {
  stars.forEach(s => { s.y += s.s * (state==='play' ? 1 + stage*0.3 : 0.6); if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; if (p.chunk) { p.rot += p.vr; p.vx *= 0.98; p.vy *= 0.98; } });
  rings.forEach(g => g.life--); rings = rings.filter(g => g.life > 0);
  parts = parts.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 0.8; f.life--; }); floaters = floaters.filter(f => f.life > 0);
  if (shake > 0) shake--; if (flash > 0) flash--;
  if (state !== 'play') { rocks.forEach(r => { r.y += r.vy*0.5; r.rot += r.vr; }); return; }

  t++;
  const speed = ship.boost > 0 ? 8 : 5.5;
  if (keys.ArrowLeft || keys.a || keys.A) ship.x -= speed;
  if (keys.ArrowRight || keys.d || keys.D) ship.x += speed;
  if (touchX !== null) ship.x += Math.max(-speed*1.5, Math.min(speed*1.5, touchX - ship.x));
  if (ship.twin && ship.wing < 34) ship.wing += 2;   // second ship slides out beside you
  ship.x = Math.max(20, Math.min(W-20-ship.wing, ship.x));
  ['shield','boost','rapid','inv'].forEach(k => { if (ship[k] > 0) ship[k]--; });
  if (comboTimer > 0 && --comboTimer === 0) combo = 0;
  if (banner > 0) banner--;

  // shooting: automatic
  if (ship.cd > 0) ship.cd--;
  if (ship.cd === 0) {   // auto-fire: the ship shoots constantly, you just steer!
    ship.cd = ship.rapid > 0 ? 6 : 14; sfx.pew();
    for (const gx of ship.twin ? [ship.x, ship.x + ship.wing] : [ship.x]) {   // both ships fire
      if (ship.rapid > 0) bullets.push({x:gx-9,y:ship.y-14},{x:gx+9,y:ship.y-14});
      else bullets.push({x:gx, y:ship.y-22});
    }
  }
  bullets.forEach(b => b.y -= 11);
  bullets = bullets.filter(b => b.y > -20 && !b.dead);

  // stage / difficulty
  const newStage = 1 + Math.floor(t / 1200);
  if (newStage !== stage) { stage = newStage; banner = 120; sfx.stage(); score += 100; }
  const level = 1 + t / 650;
  if (--spawnTimer <= 0) {
    const r = 14 + Math.random()*26;
    const rx = Math.random()*(W-2*r)+r, rvy = (1.6+Math.random()*1.8)*Math.min(level,3.6);
    let rvx = (Math.random()-0.5)*1.5;
    // from stage 2, some rocks are aimed at where you are right now
    if (stage >= 2 && Math.random() < Math.min(0.4, 0.12 + stage*0.06)) rvx = Math.max(-4, Math.min(4, (ship.x - rx) / ((ship.y + r) / rvy)));
    rocks.push(makeRock(rx, -r, r, rvy, rvx));
    spawnTimer = Math.max(10, 46 - level*6);
  }

  rocks.forEach(r => { r.y += r.vy; r.x += r.vx; r.rot += r.vr; if (r.hitFlash>0) r.hitFlash--; if (r.x<r.r||r.x>W-r.r) r.vx*=-1; });
  orbs.forEach(o => o.y += 2.5);

  // bullets vs rocks
  for (const b of bullets) for (const r of rocks) {
    if (!r.dead && !b.dead && Math.hypot(r.x-b.x, r.y-b.y) < r.r + 4) {
      b.dead = true; r.hp--; r.hitFlash = 4; boom(b.x, b.y, '#ff8', 3);
      if (r.hp <= 0) killRock(r); else sfx.hit();
    }
  }
  // rocks vs ship
  for (const r of rocks) {
    if (r.dead || ship.inv > 0) continue;
    const wx = ship.x + ship.wing;
    if (ship.twin && ship.wing > 14 && Math.hypot(r.x-wx, r.y-ship.y) < r.r + 12) {
      if (ship.shield > 0) { killRock(r); continue; }
      // the second ship takes the hit: it is destroyed, but NO life is lost
      r.dead = true; boom(wx, ship.y, '#c8f', 45); boom(r.x, r.y, '#f66', 14);
      rings.push({x:wx, y:ship.y, r:20, life:22}); ship.twin = false; ship.wing = 0; ship.inv = Math.max(ship.inv, 45);
      shake = Math.max(shake, 10); sfx.ouch(); floater(wx, ship.y - 30, 'WINGMAN LOST!', '#c8f');
      continue;
    }
    if (Math.hypot(r.x-ship.x, r.y-ship.y) > r.r + 12) continue;
    if (ship.shield > 0) { killRock(r); continue; }
    r.dead = true; boom(r.x, r.y, '#f66', 20); boom(ship.x, ship.y, '#f66', 40);
    ship.lives--; combo = 0; comboTimer = 0; shake = 18; flash = 8;
    if (ship.lives <= 0) { gameOver(); return; }
    ship.inv = 100; sfx.ouch();
  }
  // orbs
  for (const o of orbs) {
    if (Math.hypot(o.x-ship.x, o.y-ship.y) < 26 || (ship.twin && ship.wing > 14 && Math.hypot(o.x-(ship.x+ship.wing), o.y-ship.y) < 26)) {
      o.dead = true; const c = ORB[o.type].color; boom(o.x, o.y, c, 30);
      if (o.type==='shield') { ship.shield = 420; sfx.power(); }
      else if (o.type==='turbo') { ship.boost = 420; sfx.power(); }
      else if (o.type==='rapid') { ship.rapid = 480; sfx.power(); }
      else if (o.type==='twin') { if (ship.twin) addScore(250, o.x, o.y); else { ship.twin = true; ship.wing = 0; } sfx.life(); }
      addScore(50, o.x, o.y); floater(o.x, o.y - 18, ORB[o.type].label, c);
    }
  }
  rocks = rocks.filter(r => !r.dead && r.y < H+60);
  orbs = orbs.filter(o => !o.dead && o.y < H+30);
  if (t % 10 === 0) score++;
  if (score >= nextLife) {   // extra life every LIFE_EVERY points
    lifeCount++; nextLife += LIFE_EVERY * (1 + lifeCount);   // 3000, then 6000 more, then 9000 more...
    if (ship.lives < 5) { ship.lives++; sfx.life(); floater(ship.x, ship.y - 40, '1UP! EXTRA LIFE', '#6f6'); banner2 = 90; }
  }
}

const ORB = { shield:{color:'#5ef', letter:'S', label:'SHIELD!'}, turbo:{color:'#fd3', letter:'T', label:'TURBO!'},
              rapid:{color:'#f55', letter:'R', label:'RAPID FIRE!'}, twin:{color:'#c8f', letter:'D', label:'DUAL FIGHTER!'}, life:{color:'#6f6', letter:'♥', label:'1UP!'} };

function gameOver() {
  state = 'over'; overAt = Date.now(); touchX = null; boom(ship.x, ship.y, '#f66', 70); shake = 24;
  stopMusic(); sfx.crash(); loadBoard(true);
  if (score > best) { best = score; try { localStorage.setItem('sdBest', best); } catch(e){} }
}

// ---------- DRAWING ----------
function glowText(text, x, y, size, color, align='center', glow=12) {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.shadowBlur = 0;
}
const pad = n => String(n).padStart(6, '0');

function drawShip(x, y, s=1, accent='#ff3df0') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = ship && ship.boost>0 ? '#fd3' : '#f84';
  ctx.beginPath(); ctx.moveTo(-8,16); ctx.lineTo(0,28+Math.random()*10); ctx.lineTo(8,16); ctx.fill();
  ctx.shadowColor = '#5ef'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#e8f0ff'; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(16,18); ctx.lineTo(0,10); ctx.lineTo(-16,18); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(0,-2,5,0,6.28); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.fillStyle = '#07021a'; ctx.fillRect(-30,-30,W+60,H+60);
  // retro perspective grid at the bottom
  ctx.strokeStyle = 'rgba(255,61,240,0.12)'; ctx.lineWidth = 1;
  for (let i=0;i<8;i++){ const y = H*0.55 + Math.pow(i/8,2)*H*0.45 + ((t*0.5)%1); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for (let i=-6;i<=6;i++){ ctx.beginPath(); ctx.moveTo(W/2+i*20,H*0.55); ctx.lineTo(W/2+i*90,H); ctx.stroke(); }
  stars.forEach(s => { ctx.globalAlpha = 0.4 + s.s/4; ctx.fillStyle = s.s > 2 ? '#aef' : '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s*(state==='play'?2:1)); });
  ctx.globalAlpha = 1;

  rocks.forEach(r => {
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.fillStyle = r.hitFlash > 0 ? '#fff' : '#8a7a6a'; ctx.strokeStyle = '#ffb86b'; ctx.lineWidth = 3; ctx.shadowColor = '#ff9a3d'; ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i=0;i<9;i++){ const a=i/9*6.28, d=r.r*(0.8+0.2*Math.sin(i*7+r.seed)); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(r.r*0.3, -r.r*0.2, r.r*0.2, 0, 6.28); ctx.fill();
    ctx.restore();
  });
  orbs.forEach(o => {
    const c = ORB[o.type].color;
    ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.drop ? 12 + Math.sin(t/3)*2 : 12, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#000'; ctx.font = `bold 15px ${FONT}`; ctx.textAlign='center'; ctx.fillText(ORB[o.type].letter, o.x, o.y+5);
  });
  // bullets
  bullets.forEach(b => { ctx.fillStyle = '#7ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 10; ctx.fillRect(b.x-2, b.y-8, 4, 14); });
  ctx.shadowBlur = 0;

  if (state === 'play') {
    if (!(ship.inv > 0 && Math.floor(t/4)%2)) {
      const ships = ship.twin ? [[ship.x, '#ff3df0'], [ship.x + ship.wing, '#c8f']] : [[ship.x, '#ff3df0']];
      for (const [sx, col] of ships) {
        drawShip(sx, ship.y, 1, col);
        if (ship.shield > 0) { ctx.strokeStyle = `rgba(90,238,255,${ship.shield<90 ? 0.3+0.4*Math.sin(t) : 0.7})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,ship.y,30,0,6.28); ctx.stroke(); }
      }
    }
  }
  rings.forEach(g => { const k = 1 - g.life/22; ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ffd89a'; ctx.lineWidth = 4*(1-k)+1; ctx.shadowColor = '#ff9a3d'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r*(0.6 + k*1.8), 0, 6.28); ctx.stroke(); ctx.shadowBlur = 0; });
  parts.forEach(p => { ctx.globalAlpha = Math.min(1,p.life/30);
    if (p.chunk) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.strokeStyle = '#ffb86b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-p.size, -p.size*0.4); ctx.lineTo(p.size*0.2, -p.size); ctx.lineTo(p.size, p.size*0.5); ctx.lineTo(-p.size*0.3, p.size*0.8); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    else { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); } });
  ctx.globalAlpha = 1;
  floaters.forEach(f => { ctx.globalAlpha = Math.min(1, f.life/20); glowText(f.text, f.x, f.y, 16, f.color, 'center', 6); });
  ctx.globalAlpha = 1;

  if (state === 'play') drawHUD();
  else if (state === 'title') drawTitle();
  else if (state === 'board') drawBoard();
  else drawOver();

  if (flash > 0) { ctx.fillStyle = `rgba(255,60,60,${flash/16})`; ctx.fillRect(-30,-30,W+60,H+60); }
  ctx.restore();
  ctx.drawImage(scan, 0, 0);   // CRT scanlines + vignette
}

function drawHUD() {
  glowText('1UP', 16, 24, 16, '#ff3df0', 'left'); glowText(pad(score), 16, 46, 22, '#fff', 'left', 4);
  glowText('HI-SCORE', W-16, 24, 16, '#ff3df0', 'right'); glowText(pad(Math.max(best, score)), W-16, 46, 22, '#fff', 'right', 4);
  for (let i=0;i<ship.lives;i++) drawShip(26 + i*30, H-26, 0.45);
  glowText(muted ? 'MUTED (M)' : 'M = MUTE', W-14, H-14, 13, '#778', 'right', 0);
  let ly = 78; const list = [['shield','SHIELD'],['boost','TURBO'],['rapid','RAPID FIRE']];
  for (const [k, label] of list) if (ship[k] > 0) {
    const c = ORB[k==='boost'?'turbo':k].color; glowText(label, 16, ly, 13, c, 'left', 6);
    ctx.fillStyle = c; ctx.fillRect(16, ly+4, Math.min(90, ship[k]/5), 4); ly += 26;
  }
  if (combo > 1) glowText('COMBO x' + combo, W/2, 80, 22, '#ff0', 'center', 12);
  if (banner > 0) { ctx.globalAlpha = Math.min(1, banner/30); glowText(`STAGE ${stage}`, W/2, 300, 52, '#5ef', 'center', 20);
    glowText(stage === 1 ? 'GET READY!' : 'GETTING FASTER!', W/2, 340, 20, '#fff', 'center', 8); ctx.globalAlpha = 1; }
}

function drawTitle() {
  const wob = Math.sin(Date.now()/400) * 4;
  glowText('SPACE', W/2, 200 + wob, 66, '#5ef', 'center', 25);
  glowText('DODGER', W/2, 270 + wob, 66, '#ff3df0', 'center', 25);
  glowText('★ ARCADE EDITION ★', W/2, 310, 18, '#fd3', 'center', 8);
  glowText('← → / A D  MOVE', W/2, 390, 18, '#fff', 'center', 0);
  glowText('AUTO-FIRE  JUST STEER!', W/2, 418, 18, '#fff', 'center', 0);
  glowText('S SHIELD  T TURBO', W/2, 462, 16, '#5ef', 'center', 0);
  glowText('R RAPID FIRE  (drops from rocks)', W/2, 486, 16, '#f66', 'center', 0);
  glowText('D DUAL FIGHTER', W/2, 510, 16, '#c8f', 'center', 0);
  if (Math.floor(Date.now()/500)%2) glowText('INSERT COIN', W/2, 570, 30, '#fff', 'center', 14);
  glowText('PRESS SPACE OR TAP TO START', W/2, 600, 14, '#aaa', 'center', 0);
  glowText('PILOT: ' + (playerName || '???') + '  [N] CHANGE', W/2, 642, 16, '#5ef', 'center', 6);
  glowText('HI-SCORE ' + pad(best), W/2, 672, 18, '#fd3', 'center', 6);
  glowText('[L] LEADERBOARD', W/2, 704, 15, '#ff3df0', 'center', 6);
}

function drawRows(top, y0, rowH, size) {
  const mine = nameKey(playerName);
  if (boardStatus === 'loading') { glowText('LOADING...', W/2, y0 + 30, 18, '#889', 'center', 0); return; }
  if (!board.length) { glowText('NO SCORES YET', W/2, y0 + 30, 18, '#889', 'center', 0); return; }
  board.slice(0, top).forEach((r, i) => {
    const y = y0 + i * rowH, you = nameKey(r.name) === mine, c = you ? '#ff0' : (i === 0 ? '#fd3' : '#fff');
    glowText(String(i + 1).padStart(2, ' ') + '.', 90, y, size, c, 'left', you ? 8 : 0);
    const nm = typeof r.name === 'string' ? r.name.slice(0, 12) : '?'; glowText(badName(nm) ? '*'.repeat(nm.length) : nm, 135, y, size, c, 'left', you ? 8 : 0);
    glowText(pad(r.score), W - 90, y, size, c, 'right', you ? 8 : 0);
  });
}
function boardLabel() { return boardIsGlobal ? 'ONLINE - ALL PLAYERS' : (boardStatus === 'offline' ? 'OFFLINE - THIS DEVICE ONLY' : 'THIS DEVICE ONLY'); }

function drawOver() {
  ctx.fillStyle = 'rgba(0,0,10,0.72)'; ctx.fillRect(0, 130, W, 560);
  glowText('GAME OVER', W/2, 200, 54, '#f44', 'center', 22);
  glowText(playerName + '  ' + pad(score), W/2, 245, 24, '#fff', 'center', 6);
  glowText(score >= best && score > 0 ? '★ NEW HIGH SCORE! ★' : 'STAGE ' + stage + '  BEST ' + pad(best), W/2, 276, 17, '#fd3', 'center', 8);
  glowText('- TOP PILOTS -', W/2, 325, 18, '#ff3df0', 'center', 8);
  drawRows(8, 358, 25, 18);
  if (Date.now() - overAt > 1200) {
    glowText('TRY AGAIN?', W/2, 610, 34, '#fff', 'center', 14);
    if (Math.floor(Date.now()/500)%2) glowText('PRESS SPACE OR TAP', W/2, 642, 17, '#5ef', 'center', 8);
  }
}

function drawBoard() {
  ctx.fillStyle = 'rgba(0,0,10,0.78)'; ctx.fillRect(0, 40, W, 650);
  glowText('LEADERBOARD', W/2, 92, 36, '#5ef', 'center', 18);
  glowText(boardLabel(), W/2, 120, 13, boardIsGlobal ? '#6f6' : '#fd3', 'center', 4);
  drawRows(25, 165, 20, 15);
  if (Math.floor(Date.now()/500)%2) glowText('PRESS SPACE OR TAP', W/2, 676, 16, '#fff', 'center', 8);
}

(function loop(){ update(); draw(); requestAnimationFrame(loop); })();
</script>
