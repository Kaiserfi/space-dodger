<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Dodger</title>
<style>
  html, body { margin:0; height:100%; background:#05030f; color:#fff; font-family: "Trebuchet MS", sans-serif; overflow:hidden; }
  #wrap { display:flex; align-items:center; justify-content:center; height:100%; }
  canvas { background: radial-gradient(ellipse at top, #1b1050, #05030f 70%); max-width:100%; max-height:100%; border:2px solid #4b3bff; border-radius:12px; touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let state = 'title', score = 0, best = +(localStorage.getItem('sdBest') || 0);
let ship, rocks, stars, orbs, parts, t, spawnTimer, orbTimer, shake;
const keys = {};
let touchX = null;

addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' || e.key === 'Enter') { if (state !== 'play') start(); } });
addEventListener('keyup', e => keys[e.key] = false);
function pos(e){ const r = cv.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return (p.clientX - r.left) * W / r.width; }
cv.addEventListener('pointerdown', e => { if (state !== 'play') start(); touchX = pos(e); });
cv.addEventListener('pointermove', e => { if (touchX !== null) touchX = pos(e); });
addEventListener('pointerup', () => touchX = null);

stars = Array.from({length:70}, () => ({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5}));

function start() {
  state = 'play'; score = 0; t = 0; spawnTimer = 0; orbTimer = 0; shake = 0;
  ship = {x:W/2, y:H-90, w:30, shield:0, boost:0};
  rocks = []; orbs = []; parts = [];
}

function boom(x, y, color, n=24) {
  for (let i=0;i<n;i++) { const a=Math.random()*6.28, s=Math.random()*5+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40+Math.random()*20,color}); }
}

function update() {
  stars.forEach(s => { s.y += s.s * (state==='play' ? 1+score/400 : 0.6); if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; });
  parts = parts.filter(p => p.life > 0);
  if (state !== 'play') return;

  t++;
  const speed = (ship.boost > 0 ? 8 : 5.5);
  if (keys.ArrowLeft || keys.a) ship.x -= speed;
  if (keys.ArrowRight || keys.d) ship.x += speed;
  if (touchX !== null) ship.x += Math.max(-speed*1.5, Math.min(speed*1.5, touchX - ship.x));
  ship.x = Math.max(20, Math.min(W-20, ship.x));
  if (ship.shield > 0) ship.shield--;
  if (ship.boost > 0) ship.boost--;
  if (shake > 0) shake--;

  // difficulty ramps up with time
  const level = 1 + t / 600;
  if (--spawnTimer <= 0) {
    const r = 14 + Math.random()*26;
    rocks.push({x:Math.random()*(W-2*r)+r, y:-r, r, vy:(2+Math.random()*2)*Math.min(level,3), vx:(Math.random()-0.5)*1.5, rot:0, vr:(Math.random()-0.5)*0.1});
    spawnTimer = Math.max(12, 45 - level*6);
  }
  if (--orbTimer <= 0) { orbs.push({x:Math.random()*(W-40)+20, y:-20, type: Math.random()<0.5 ? 'shield' : 'boost'}); orbTimer = 420 + Math.random()*300; }

  rocks.forEach(r => { r.y += r.vy; r.x += r.vx; r.rot += r.vr; if (r.x<r.r||r.x>W-r.r) r.vx*=-1; });
  orbs.forEach(o => o.y += 2.5);

  for (const r of rocks) {
    if (Math.hypot(r.x-ship.x, r.y-ship.y) < r.r + 12) {
      if (ship.shield > 0) { r.dead = true; boom(r.x, r.y, '#7df', 20); score += 5; }
      else { gameOver(); return; }
    }
  }
  for (const o of orbs) {
    if (Math.hypot(o.x-ship.x, o.y-ship.y) < 24) {
      o.dead = true; boom(o.x, o.y, o.type==='shield'?'#7df':'#fd5', 30);
      if (o.type==='shield') ship.shield = 360; else { ship.boost = 360; }
      score += 25;
    }
  }
  rocks = rocks.filter(r => !r.dead && r.y < H+60);
  orbs = orbs.filter(o => !o.dead && o.y < H+30);
  if (t % 6 === 0) score++;
}

function gameOver() {
  state = 'over'; boom(ship.x, ship.y, '#f66', 60); shake = 20;
  if (score > best) { best = score; try { localStorage.setItem('sdBest', best); } catch(e){} }
}

function drawShip() {
  ctx.save(); ctx.translate(ship.x, ship.y);
  if (ship.shield > 0) { ctx.strokeStyle = `rgba(120,220,255,${0.5+0.3*Math.sin(t/4)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,28,0,6.28); ctx.stroke(); }
  // flame
  ctx.fillStyle = ship.boost>0 ? '#fd5' : '#f84';
  ctx.beginPath(); ctx.moveTo(-8,16); ctx.lineTo(0,28+Math.random()*10+(ship.boost>0?10:0)); ctx.lineTo(8,16); ctx.fill();
  // body
  ctx.fillStyle = '#e8f0ff'; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(16,18); ctx.lineTo(0,10); ctx.lineTo(-16,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4b3bff'; ctx.beginPath(); ctx.arc(0,-2,5,0,6.28); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.clearRect(-20,-20,W+40,H+40);
  ctx.fillStyle = '#fff';
  stars.forEach(s => { ctx.globalAlpha = 0.4 + s.s/4; ctx.fillRect(s.x, s.y, s.s, s.s*(state==='play'?2:1)); });
  ctx.globalAlpha = 1;

  if (state === 'play' || state === 'over') {
    rocks.forEach(r => {
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
      ctx.fillStyle = '#8a7a6a'; ctx.strokeStyle = '#4a3f35'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i=0;i<9;i++){ const a=i/9*6.28, d=r.r*(0.8+0.2*Math.sin(i*7+r.r)); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#6a5d50'; ctx.beginPath(); ctx.arc(r.r*0.3, -r.r*0.2, r.r*0.2, 0, 6.28); ctx.fill();
      ctx.restore();
    });
    orbs.forEach(o => {
      ctx.fillStyle = o.type==='shield' ? '#7df' : '#fd5';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(o.x, o.y, 11, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#000'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(o.type==='shield'?'S':'⚡', o.x, o.y+5);
    });
    if (state === 'play') drawShip();
  }
  parts.forEach(p => { ctx.globalAlpha = p.life/60; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  if (state === 'play') {
    ctx.textAlign='left'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('Score ' + score, 14, 32);
    ctx.textAlign='right'; ctx.fillText('Best ' + best, W-14, 32);
    ctx.textAlign='left'; ctx.font='14px sans-serif';
    if (ship.shield>0) { ctx.fillStyle='#7df'; ctx.fillText('SHIELD', 14, 54); }
    if (ship.boost>0) { ctx.fillStyle='#fd5'; ctx.fillText('TURBO', 14, ship.shield>0?72:54); }
  } else if (state === 'title') {
    ctx.font = 'bold 54px sans-serif'; ctx.fillStyle = '#9bf'; ctx.fillText('SPACE', W/2, 250); ctx.fillStyle='#f8a'; ctx.fillText('DODGER', W/2, 310);
    ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif';
    ctx.fillText('← → or A / D to fly (or drag on a phone)', W/2, 380);
    ctx.fillText('Dodge the asteroids!', W/2, 415);
    ctx.fillStyle='#7df'; ctx.fillText('S = shield (smash rocks!)', W/2, 455);
    ctx.fillStyle='#fd5'; ctx.fillText('⚡ = turbo speed', W/2, 485);
    ctx.fillStyle='#fff'; ctx.font = 'bold 26px sans-serif';
    if (Math.floor(Date.now()/500)%2) ctx.fillText('Press SPACE or tap to start', W/2, 570);
    ctx.font='16px sans-serif'; ctx.fillStyle='#aaa'; ctx.fillText('Best: ' + best, W/2, 610);
  } else if (state === 'over') {
    ctx.font = 'bold 48px sans-serif'; ctx.fillStyle = '#f66'; ctx.fillText('CRASHED!', W/2, 290);
    ctx.fillStyle = '#fff'; ctx.font = '26px sans-serif'; ctx.fillText('Score: ' + score, W/2, 340);
    ctx.fillText(score >= best && score > 0 ? '🏆 NEW HIGH SCORE!' : 'Best: ' + best, W/2, 380);
    ctx.font = 'bold 22px sans-serif'; ctx.fillText('Press SPACE or tap to retry', W/2, 450);
  }
  ctx.restore();
}

(function loop(){ update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
