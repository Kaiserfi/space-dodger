# ITAP Adventure is built from adventure/src/ into adventure/index.html (node tools/build-adventure.js).
# This checks every push and pull request: the script parses, no top-level name is defined twice,
# and the committed adventure/index.html matches its sources (nobody edited it directly or forgot to rebuild).
name: Adventure build check
on:
  push:
    paths: ['adventure/**', 'tools/build-adventure.js', '.github/workflows/adventure-build.yml']
  pull_request:
    paths: ['adventure/**', 'tools/build-adventure.js', '.github/workflows/adventure-build.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-adventure.js --check
